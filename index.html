<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>UVISTIX WORDS Teleprompter</title>
  <script src="script.js"></script>

  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #f1f5f9 !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      outline: none;
    }

    /* ==============================
       TOP CONTROL BAR
       ============================== */

    #header {
      background: #141414;
      padding: 6px 8px;
      border-bottom: 1px solid #333333;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      z-index: 100;
      overflow: hidden;
      opacity: 1;
      -webkit-transition: opacity 0.4s ease;
      transition: opacity 0.4s ease;
      white-space: nowrap;
    }

    #header.autohidden {
      opacity: 0;
      pointer-events: none;
    }

    .btn {
      background: #2b2b2b;
      color: #f1f5f9 !important;
      border: 1px solid #444444;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      -webkit-border-radius: 4px;
      float: left;
      margin-right: 5px;
      height: 34px;
      line-height: 24px;
      cursor: pointer;
      -webkit-appearance: none;
      outline: none !important;
    }

    .btn.active {
      background: #0070f3 !important;
    }

    #playBtn {
      background: #16a34a;
    }

    #playBtn.paused {
      background: #ea580c;
    }

    #playBtn.counting {
      background: #ca8a04;
    }

    /* ==============================
       PART DROPDOWN
       ============================== */

    .dropdown-select {
      background: #1e293b;
      color: #38bdf8 !important;
      border: 1px solid #0284c7;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      -webkit-border-radius: 4px;
      float: left;
      margin-right: 8px;
      height: 34px;
      cursor: pointer;
      outline: none;
      -webkit-appearance: menulist;
    }

    .control-label {
      float: left;
      font-size: 12px;
      color: #f1f5f9 !important;
      line-height: 34px;
      margin-right: 5px;
    }

    .timer-box {
      float: right;
      font-family: monospace;
      font-size: 11px;
      background: #000000;
      padding: 4px 6px;
      border: 1px solid #333333;
      border-radius: 4px;
      -webkit-border-radius: 4px;
      color: #f1f5f9 !important;
      line-height: 24px;
      height: 34px;
    }

    /* ==============================
       PROMPTER VIEWPORT
       ============================== */

    #prompterViewport {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      overflow: hidden;
      background: #000000;
      padding-left: 15px;
      padding-right: 15px;
      cursor: grab;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    #prompterText {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;

      /*
       * DEFAULT FONT SIZE
       *
       * Original was 44px.
       * Existing A- behavior:
       * 44 -> 40 -> 36 -> 32 -> 28
       *
       * Therefore new default is 28px.
       */
      font-size: 28px;

      line-height: 1.45;
      font-weight: bold;
      text-align: center;
      color: #f1f5f9 !important;

      /*
       * IMPORTANT:
       * This preserves \n and \n\n from the script.
       */
      white-space: pre-wrap;
      word-wrap: break-word;

      outline: none;

      -webkit-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);

      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;

      padding-bottom: 30px;
    }

    /* ==============================
       EYE LINE
       ============================== */

    .eye-chevron {
      position: absolute;
      top: 65%;
      font-size: 30px;
      line-height: 1;
      color: rgba(241, 245, 249, 0.45);
      z-index: 50;
      pointer-events: none;
      margin-top: -15px;

      -webkit-transition: top 0.25s ease;
      transition: top 0.25s ease;
    }

    #chevronLeft {
      left: 12px;
    }

    #chevronRight {
      right: 12px;
    }

    #eyeGuideLine {
      position: absolute;
      top: 65%;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(56, 189, 248, 0.15);
      pointer-events: none;
      z-index: 40;

      -webkit-transition: top 0.25s ease;
      transition: top 0.25s ease;
    }

    /* ==============================
       COUNTDOWN
       ============================== */

    #countdownOverlay {
      display: none;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 90;
      text-align: center;
      padding-top: 140px;
    }

    #countdownNumber {
      font-size: 120px;
      font-weight: 900;
      color: #38bdf8;
      font-family: monospace;
      line-height: 1;
    }

    #countdownSubtext {
      font-size: 18px;
      color: #94a3b8;
      margin-top: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #skipCountdownBtn {
      margin-top: 20px;
      padding: 8px 20px;
      font-size: 14px;
      background: #333333;
      border: 1px solid #555555;
      color: #f1f5f9;
      border-radius: 4px;
      -webkit-border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body tabindex="0">

  <!-- ==============================
       TOP CONTROL BAR
       ============================== -->

  <div id="header">

    <button id="playBtn" class="btn" tabindex="-1">Play</button>

    <button id="resetBtn" class="btn" tabindex="-1">Reset</button>

    <select id="partSelector" class="dropdown-select" tabindex="-1"></select>

    <button
      id="eyeLineBtn"
      class="btn active"
      tabindex="-1"
      title="Adjust Eye Line to Camera Position">
      Eye: Low (65%)
    </button>

    <button id="alignLeftBtn" class="btn" tabindex="-1">Left</button>

    <button id="alignCenterBtn" class="btn active" tabindex="-1">Center</button>

    <button id="alignRightBtn" class="btn" tabindex="-1">Right</button>

    <span class="control-label">Spd:</span>

    <button id="speedDownBtn" class="btn" tabindex="-1">-</button>

    <button id="speedUpBtn" class="btn" tabindex="-1">+</button>

    <span
      id="speedVal"
      class="control-label"
      style="font-weight:bold;">
      1.0x
    </span>

    <span class="control-label">Font:</span>

    <button id="fontDownBtn" class="btn" tabindex="-1">A-</button>

    <button id="fontUpBtn" class="btn" tabindex="-1">A+</button>

    <!-- NEW: Actual font size display -->
    <span
      id="fontVal"
      class="control-label"
      style="font-weight:bold;">
      28px
    </span>

    <button id="widthBtn" class="btn" tabindex="-1">W: Mid</button>

    <button id="mirrorBtn" class="btn" tabindex="-1">Mirror</button>

    <button id="reverseBtn" class="btn" tabindex="-1">Reverse</button>

    <button id="fullscreenBtn" class="btn" tabindex="-1">Full</button>

    <div id="timerDisplay" class="timer-box">
      00:00.0 / 00:00.0
    </div>

  </div>

  <!-- Eye-line guide -->

  <div id="eyeGuideLine"></div>

  <div id="chevronLeft" class="eye-chevron">&#x25BA;</div>

  <div id="chevronRight" class="eye-chevron">&#x25C4;</div>


  <!-- ==============================
       COUNTDOWN OVERLAY
       ============================== -->

  <div id="countdownOverlay">

    <div id="countdownNumber">5</div>

    <div id="countdownSubtext">
      Starting in...
    </div>

    <button id="skipCountdownBtn" tabindex="-1">
      Start Now
    </button>

  </div>


  <!-- ==============================
       PROMPTER
       ============================== -->

  <div id="prompterViewport" tabindex="0">

    <div id="prompterText"></div>

  </div>


  <script>

    /*
     * ==========================================================
     * iOS 5.1.1 / OLD SAFARI COMPATIBILITY
     * ==========================================================
     */

    if (!String.prototype.trim) {
      String.prototype.trim = function () {
        return this.replace(/^\s+|\s+$/g, '');
      };
    }


    


    /*
     * ==========================================================
     * DOM REFERENCES
     * ==========================================================
     */

    var header = document.getElementById("header");
    var viewport = document.getElementById("prompterViewport");
    var prompterText = document.getElementById("prompterText");

    var playBtn = document.getElementById("playBtn");
    var resetBtn = document.getElementById("resetBtn");

    var partSelector = document.getElementById("partSelector");

    var eyeLineBtn = document.getElementById("eyeLineBtn");
    var chevronLeft = document.getElementById("chevronLeft");
    var chevronRight = document.getElementById("chevronRight");
    var eyeGuideLine = document.getElementById("eyeGuideLine");

    var alignLeftBtn = document.getElementById("alignLeftBtn");
    var alignCenterBtn = document.getElementById("alignCenterBtn");
    var alignRightBtn = document.getElementById("alignRightBtn");

    var speedDownBtn = document.getElementById("speedDownBtn");
    var speedUpBtn = document.getElementById("speedUpBtn");
    var speedVal = document.getElementById("speedVal");

    var fontDownBtn = document.getElementById("fontDownBtn");
    var fontUpBtn = document.getElementById("fontUpBtn");
    var fontVal = document.getElementById("fontVal");

    var widthBtn = document.getElementById("widthBtn");

    var mirrorBtn = document.getElementById("mirrorBtn");
    var reverseBtn = document.getElementById("reverseBtn");
    var fullscreenBtn = document.getElementById("fullscreenBtn");

    var timerDisplay = document.getElementById("timerDisplay");

    var countdownOverlay = document.getElementById("countdownOverlay");
    var countdownNumber = document.getElementById("countdownNumber");
    var skipCountdownBtn = document.getElementById("skipCountdownBtn");


    /*
     * ==========================================================
     * SETTINGS
     * ==========================================================
     */

    var eyeLinePositions = [
      {
        ratio: 0.65,
        label: "Eye: Low (65%)"
      },
      {
        ratio: 0.75,
        label: "Eye: Deep (75%)"
      },
      {
        ratio: 0.40,
        label: "Eye: High (40%)"
      },
      {
        ratio: 0.52,
        label: "Eye: Mid (52%)"
      }
    ];

    var currentEyeLineIdx = 0;

    var isPlaying = false;
    var isCountingDown = false;

    var countdownTimer = null;
    var countdownValue = 5;

    var scrollInterval = null;

    var elapsedMs = 0;

    /*
     * SPEED
     *
     * Old:
     * 1.5
     *
     * New:
     * 1.0
     *
     * Step:
     * 0.1
     */
    var speed = 1.0;

    /*
     * FONT
     *
     * Old default:
     * 44px
     *
     * Four A- taps:
     * 44 -> 40 -> 36 -> 32 -> 28
     *
     * New default:
     * 28px
     */
    var fontSize = 28;

    var currentY = 0;

    var isMirrored = false;
    var isReversed = false;

    var hideHeaderTimeout = null;


    /*
     * ==========================================================
     * WIDTH OPTIONS
     * ==========================================================
     */

    var widths = [
      {
        size: "400px",
        label: "W: Nar"
      },
      {
        size: "520px",
        label: "W: Mid"
      },
      {
        size: "100%",
        label: "W: Full"
      }
    ];

    var currentWidthIdx = 1;


    /*
     * ==========================================================
     * FULLSCREEN DETECTION
     * ==========================================================
     */

    var supportsFullscreen =
      document.documentElement.requestFullscreen ||
      document.documentElement.webkitRequestFullscreen ||
      document.documentElement.mozRequestFullScreen;

    if (!supportsFullscreen) {
      fullscreenBtn.style.display = "none";
    }


    /*
     * ==========================================================
     * BUTTON FOCUS
     * ==========================================================
     */

    var buttons = document.getElementsByTagName("button");

    for (var i = 0; i < buttons.length; i++) {

      buttons[i].onmouseup = function() {
        this.blur();
      };

      buttons[i].onclick = function() {
        this.blur();
      };

    }


    /*
     * ==========================================================
     * FIND SCRIPT PARTS
     * ==========================================================
     */

    var availableParts = [];

    for (var p = 1; p <= 6; p++) {

      var val = window["SCRIPT_PART_" + p];

      if (
        typeof val === "string" &&
        val.replace(/^\s+|\s+$/g, '') !== ""
      ) {

        availableParts.push({
          label: "Part " + p,
          content: val
        });

      }
    }


    /*
     * ==========================================================
     * DISPLAY SCRIPT
     *
     * IMPORTANT:
     *
     * DO NOT use innerHTML + <br/>.
     *
     * textContent + white-space: pre-wrap preserves:
     *
     * \n  = new line
     *
     * \n\n = blank line
     * ==========================================================
     */

    partSelector.innerHTML = "";

    if (availableParts.length > 0) {

      for (var j = 0; j < availableParts.length; j++) {

        var opt = document.createElement("option");

        opt.value = j;
        opt.text = availableParts[j].label;

        partSelector.appendChild(opt);
      }

      /*
       * THIS IS THE IMPORTANT FIX
       */
      prompterText.textContent = availableParts[0].content;

      partSelector.style.display =
        (availableParts.length > 1) ? "block" : "none";

    } else {

      partSelector.style.display = "none";
      prompterText.textContent = "No script found.";

    }


    /*
     * ==========================================================
     * EYE LINE
     * ==========================================================
     */

    function updateEyeLineVisuals() {

      var pct =
        Math.round(
          eyeLinePositions[currentEyeLineIdx].ratio * 100
        );

      chevronLeft.style.top = pct + "%";
      chevronRight.style.top = pct + "%";

      eyeGuideLine.style.top = pct + "%";

      eyeLineBtn.innerHTML =
        eyeLinePositions[currentEyeLineIdx].label;
    }


    /*
     * ==========================================================
     * SWITCH SCRIPT PART
     * ==========================================================
     */

    function switchPart(idx) {

      if (availableParts[idx]) {

        partSelector.value = idx;

        /*
         * IMPORTANT:
         * textContent preserves blank lines.
         */
        prompterText.textContent =
          availableParts[idx].content;

        resetPrompter();
      }
    }


    partSelector.onchange = function() {

      switchPart(
        parseInt(this.value, 10)
      );

      this.blur();
    };


    /*
     * ==========================================================
     * START POSITION
     * ==========================================================
     */

    function getStartOffset() {

      var viewH =
        window.innerHeight || 768;

      var ratio =
        eyeLinePositions[currentEyeLineIdx].ratio;

      return Math.floor(viewH * ratio);
    }


    /*
     * ==========================================================
     * MINIMUM Y
     * ==========================================================
     */

    function getMinY() {

      var viewH =
        window.innerHeight || 768;

      var textH =
        prompterText.offsetHeight || 0;

      var eyeLine =
        getStartOffset();

      var endLimit =
        eyeLine - textH;

      return Math.min(
        getStartOffset(),
        endLimit
      );
    }


    /*
     * ==========================================================
     * CLAMP POSITION
     * ==========================================================
     */

    function clampY(val) {

      var maxY =
        getStartOffset();

      var minY =
        getMinY();

      if (val > maxY) {
        return maxY;
      }

      if (val < minY) {
        return minY;
      }

      return val;
    }


    /*
     * ==========================================================
     * APPLY TRANSFORM
     * ==========================================================
     */

    function applyTransform() {

      var scaleX =
        isMirrored ? -1 : 1;

      var scaleY =
        isReversed ? -1 : 1;

      var transformStr =
        "translate3d(0px, " +
        Math.round(currentY) +
        "px, 0px) scale(" +
        scaleX +
        ", " +
        scaleY +
        ")";

      prompterText.style.webkitTransform =
        transformStr;

      prompterText.style.transform =
        transformStr;
    }


    /*
     * ==========================================================
     * HEADER
     * ==========================================================
     */

    function showHeader() {

      header.className = "";

      if (hideHeaderTimeout) {
        clearTimeout(hideHeaderTimeout);
      }

      if (isPlaying) {

        hideHeaderTimeout =
          setTimeout(function() {

            header.className = "autohidden";

          }, 2500);
      }
    }


    /*
     * ==========================================================
     * MOUSE / TOUCH
     * ==========================================================
     */

    window.ontouchstart = showHeader;


    /*
     * ==========================================================
     * RESET
     * ==========================================================
     */

    function resetPrompter() {

      stopCountdown();

      togglePlay(false);

      currentY =
        getStartOffset();

      elapsedMs = 0;

      applyTransform();

      updateTimers();

      showHeader();
    }


    /*
     * INITIALIZE
     * ==========================================================
     */

    updateEyeLineVisuals();

    currentY =
      getStartOffset();

    applyTransform();


    /*
     * ==========================================================
     * TIME FORMAT
     * ==========================================================
     */

    function formatTimeMs(totalMs) {

      if (totalMs < 0) {
        totalMs = 0;
      }

      var minutes =
        Math.floor(totalMs / 60000);

      var seconds =
        Math.floor(
          (totalMs % 60000) / 1000
        );

      var tenths =
        Math.floor(
          (totalMs % 1000) / 100
        );

      return (
        (minutes < 10 ? "0" + minutes : minutes) +
        ":" +
        (seconds < 10 ? "0" + seconds : seconds) +
        "." +
        tenths
      );
    }


    /*
     * ==========================================================
     * UPDATE TIMER
     * ==========================================================
     */

    function updateTimers() {

      var textH =
        prompterText.offsetHeight || 1000;

      var pxPerMs =
        (speed * 25) / 1000;

      var totalEstimatedMs =
        textH / pxPerMs;

      timerDisplay.innerHTML =
        formatTimeMs(elapsedMs) +
        " / " +
        formatTimeMs(totalEstimatedMs);
    }


    /*
     * ==========================================================
     * SCROLL STEP
     * ==========================================================
     */

    function stepScroll() {

      if (!isPlaying) {
        return;
      }

      var step =
        (speed * 25) * 0.03;

      elapsedMs += 30;

      if (isReversed) {

        currentY += step;

        if (
          currentY >=
          getStartOffset()
        ) {

          currentY =
            getStartOffset();

          applyTransform();

          togglePlay(false);

          updateTimers();

          return;
        }

      } else {

        currentY -= step;

        var minY =
          getMinY();

        if (currentY <= minY) {

          currentY = minY;

          applyTransform();

          togglePlay(false);

          updateTimers();

          return;
        }
      }

      applyTransform();

      updateTimers();
    }


    /*
     * ==========================================================
     * COUNTDOWN
     * ==========================================================
     */

    function stopCountdown() {

      if (countdownTimer) {

        clearInterval(
          countdownTimer
        );

        countdownTimer = null;
      }

      isCountingDown = false;

      countdownOverlay.style.display =
        "none";
    }


    function startCountdown() {

      stopCountdown();

      isCountingDown = true;

      countdownValue = 5;

      countdownNumber.innerHTML =
        countdownValue;

      countdownOverlay.style.display =
        "block";

      playBtn.innerHTML =
        "Cancel (5s)";

      playBtn.className =
        "btn counting";

      countdownTimer =
        setInterval(function() {

          countdownValue--;

          if (countdownValue > 0) {

            countdownNumber.innerHTML =
              countdownValue;

          } else {

            stopCountdown();

            startActualScroll();
          }

        }, 1000);
    }


    /*
     * ==========================================================
     * ACTUAL SCROLL START
     * ==========================================================
     */

    function startActualScroll() {

      isPlaying = true;

      playBtn.innerHTML =
        "Pause";

      playBtn.className =
        "btn paused";

      if (scrollInterval) {

        clearInterval(
          scrollInterval
        );
      }

      scrollInterval =
        setInterval(
          stepScroll,
          30
        );

      showHeader();
    }


    /*
     * ==========================================================
     * PLAY / PAUSE
     * ==========================================================
     */

    function togglePlay(forceState) {

      if (isCountingDown) {

        stopCountdown();

        playBtn.innerHTML =
          "Play";

        playBtn.className =
          "btn";

        showHeader();

        return;
      }

      var target;

      if (
        typeof forceState !==
        "undefined"
      ) {

        target = forceState;

      } else {

        target = !isPlaying;
      }

      if (target) {

        startCountdown();

      } else {

        isPlaying = false;

        playBtn.innerHTML =
          "Play";

        playBtn.className =
          "btn";

        if (scrollInterval) {

          clearInterval(
            scrollInterval
          );
        }

        showHeader();
      }
    }


    /*
     * ==========================================================
     * SKIP COUNTDOWN
     * ==========================================================
     */

    skipCountdownBtn.onclick =
      function() {

        stopCountdown();

        startActualScroll();

        this.blur();
      };


    /*
     * ==========================================================
     * WIDTH
     * ==========================================================
     */

    function cycleWidth() {

      currentWidthIdx =
        (currentWidthIdx + 1) %
        widths.length;

      prompterText.style.maxWidth =
        widths[currentWidthIdx].size;

      widthBtn.innerHTML =
        widths[currentWidthIdx].label;

      currentY =
        clampY(currentY);

      applyTransform();

      updateTimers();
    }


    /*
     * ==========================================================
     * EYE LINE
     * ==========================================================
     */

    function cycleEyeLine() {

      var oldRatio =
        eyeLinePositions[
          currentEyeLineIdx
        ].ratio;

      currentEyeLineIdx =
        (currentEyeLineIdx + 1) %
        eyeLinePositions.length;

      var newRatio =
        eyeLinePositions[
          currentEyeLineIdx
        ].ratio;

      updateEyeLineVisuals();

      var viewH =
        window.innerHeight || 768;

      var shiftPx =
        Math.floor(
          viewH *
          (newRatio - oldRatio)
        );

      currentY =
        clampY(
          currentY + shiftPx
        );

      applyTransform();

      updateTimers();
    }


    eyeLineBtn.onclick =
      function() {

        cycleEyeLine();

        this.blur();
      };


    /*
     * ==========================================================
     * TOUCH DRAGGING
     * ==========================================================
     */

    var touchStartY = 0;
    var touchStartCurrentY = 0;
    var isDragging = false;


    viewport.ontouchstart =
      function(e) {

        showHeader();

        if (
          e.touches &&
          e.touches.length === 1
        ) {

          touchStartY =
            e.touches[0].pageY;

          touchStartCurrentY =
            currentY;

          isDragging = true;
        }
      };


    viewport.ontouchmove =
      function(e) {

        if (
          isDragging &&
          e.touches &&
          e.touches.length === 1
        ) {

          if (e.preventDefault) {
            e.preventDefault();
          }

          var touchCurrentY =
            e.touches[0].pageY;

          var deltaY =
            touchCurrentY -
            touchStartY;

          currentY =
            clampY(
              touchStartCurrentY +
              deltaY
            );

          applyTransform();
        }
      };


    viewport.ontouchend =
      function() {

        isDragging = false;
      };


    viewport.ontouchcancel =
      function() {

        isDragging = false;
      };


    /*
     * ==========================================================
     * MOUSE DRAGGING
     * ==========================================================
     */

    viewport.onmousedown =
      function(e) {

        showHeader();

        e = e || window.event;

        touchStartY =
          e.pageY || e.clientY;

        touchStartCurrentY =
          currentY;

        isDragging = true;
      };


    window.onmousemove =
      function(e) {

        showHeader();

        if (isDragging) {

          e = e || window.event;

          var mouseY =
            e.pageY || e.clientY;

          var deltaY =
            mouseY - touchStartY;

          currentY =
            clampY(
              touchStartCurrentY +
              deltaY
            );

          applyTransform();
        }
      };


    window.onmouseup =
      function() {

        isDragging = false;
      };


    /*
     * ==========================================================
     * MOUSE WHEEL
     * ==========================================================
     */

    function handleWheel(e) {

      e = e || window.event;

      if (e.preventDefault) {
        e.preventDefault();
      }

      showHeader();

      var delta =
        e.deltaY ||
        -e.wheelDelta ||
        0;

      currentY =
        clampY(
          currentY -
          delta * 0.8
        );

      applyTransform();
    }


    if (viewport.addEventListener) {

      viewport.addEventListener(
        "wheel",
        handleWheel,
        false
      );

      viewport.addEventListener(
        "mousewheel",
        handleWheel,
        false
      );

      viewport.addEventListener(
        "DOMMouseScroll",
        handleWheel,
        false
      );

    } else {

      viewport.onmousewheel =
        handleWheel;
    }


    /*
     * ==========================================================
     * TEXT ALIGNMENT
     * ==========================================================
     */

    function setAlignment(alignment) {

      prompterText.style.textAlign =
        alignment;

      alignLeftBtn.className =
        alignment === "left"
          ? "btn active"
          : "btn";

      alignCenterBtn.className =
        alignment === "center"
          ? "btn active"
          : "btn";

      alignRightBtn.className =
        alignment === "right"
          ? "btn active"
          : "btn";
    }


    /*
     * ==========================================================
     * PLAY BUTTON
     * ==========================================================
     */

    playBtn.onclick =
      function() {

        togglePlay();

        this.blur();
      };


    /*
     * ==========================================================
     * RESET BUTTON
     * ==========================================================
     */

    resetBtn.onclick =
      function() {

        resetPrompter();

        this.blur();
      };


    /*
     * ==========================================================
     * ALIGNMENT BUTTONS
     * ==========================================================
     */

    alignLeftBtn.onclick =
      function() {

        setAlignment("left");

        this.blur();
      };


    alignCenterBtn.onclick =
      function() {

        setAlignment("center");

        this.blur();
      };


    alignRightBtn.onclick =
      function() {

        setAlignment("right");

        this.blur();
      };


    /*
     * ==========================================================
     * SPEED DOWN
     *
     * NEW:
     *
     * 1.0
     * 0.9
     * 0.8
     * 0.7
     * ...
     *
     * Step = 0.1
     * ==========================================================
     */

    speedDownBtn.onclick =
      function() {

        if (speed > 0.3) {

          speed =
            +(speed - 0.1)
              .toFixed(1);
        }

        speedVal.innerHTML =
          speed.toFixed(1) + "x";

        updateTimers();

        this.blur();
      };


    /*
     * ==========================================================
     * SPEED UP
     *
     * NEW:
     *
     * 1.0
     * 1.1
     * 1.2
     * 1.3
     * 1.4
     * 1.5
     * ...
     *
     * Step = 0.1
     * ==========================================================
     */

    speedUpBtn.onclick =
      function() {

        if (speed < 8.0) {

          speed =
            +(speed + 0.1)
              .toFixed(1);
        }

        speedVal.innerHTML =
          speed.toFixed(1) + "x";

        updateTimers();

        this.blur();
      };


    /*
     * ==========================================================
     * FONT DOWN
     *
     * 28 -> 24 -> 20 -> 16...
     *
     * STEP = 4px
     * ==========================================================
     */

    fontDownBtn.onclick =
      function() {

        if (fontSize > 18) {

          fontSize -= 4;
        }

        prompterText.style.fontSize =
          fontSize + "px";

        fontVal.innerHTML =
          fontSize + "px";

        currentY =
          clampY(currentY);

        applyTransform();

        updateTimers();

        this.blur();
      };


    /*
     * ==========================================================
     * FONT UP
     *
     * 28 -> 32 -> 36 -> 40...
     *
     * STEP = 4px
     * ==========================================================
     */

    fontUpBtn.onclick =
      function() {

        if (fontSize < 100) {

          fontSize += 4;
        }

        prompterText.style.fontSize =
          fontSize + "px";

        fontVal.innerHTML =
          fontSize + "px";

        currentY =
          clampY(currentY);

        applyTransform();

        updateTimers();

        this.blur();
      };


    /*
     * ==========================================================
     * WIDTH BUTTON
     * ==========================================================
     */

    widthBtn.onclick =
      function() {

        cycleWidth();

        this.blur();
      };


    /*
     * ==========================================================
     * MIRROR
     * ==========================================================
     */

    mirrorBtn.onclick =
      function() {

        isMirrored =
          !isMirrored;

        mirrorBtn.className =
          isMirrored
            ? "btn active"
            : "btn";

        applyTransform();

        this.blur();
      };


    /*
     * ==========================================================
     * REVERSE
     * ==========================================================
     */

    reverseBtn.onclick =
      function() {

        isReversed =
          !isReversed;

        reverseBtn.className =
          isReversed
            ? "btn active"
            : "btn";

        applyTransform();

        this.blur();
      };


    /*
     * ==========================================================
     * FULLSCREEN
     * ==========================================================
     */

    fullscreenBtn.onclick =
      function() {

        var doc =
          document.documentElement;

        var isFull =
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement;

        if (!isFull) {

          if (doc.requestFullscreen) {

            doc.requestFullscreen();

          } else if (
            doc.webkitRequestFullscreen
          ) {

            doc.webkitRequestFullscreen();

          }

        } else {

          if (document.exitFullscreen) {

            document.exitFullscreen();

          } else if (
            document.webkitExitFullscreen
          ) {

            document.webkitExitFullscreen();
          }
        }

        this.blur();
      };


    /*
     * ==========================================================
     * KEYBOARD / WIRELESS REMOTE
     * ==========================================================
     */

    function handleKeyDown(e) {

      e = e || window.event;

      var code =
        e.keyCode || e.which;

      var key =
        e.key || "";

      showHeader();


      /*
       * NUMBER KEYS 1-6
       *
       * Jump to Part 1-6
       */

      if (
        (code >= 49 && code <= 54) ||
        (code >= 97 && code <= 102)
      ) {

        var partNum;

        if (code >= 97) {

          partNum =
            code - 96;

        } else {

          partNum =
            code - 48;
        }

        var partIdx =
          partNum - 1;

        if (availableParts[partIdx]) {

          switchPart(partIdx);

          return false;
        }
      }


      /*
       * SPACEBAR
       *
       * Play / Pause
       */

      if (
        code === 32 ||
        key === " " ||
        key === "Spacebar"
      ) {

        if (e.preventDefault) {
          e.preventDefault();
        }

        if (e.stopPropagation) {
          e.stopPropagation();
        }

        togglePlay();

        return false;
      }


      /*
       * UP ARROW
       *
       * Move text upward
       */

      if (
        code === 38 ||
        key === "ArrowUp" ||
        key === "Up"
      ) {

        if (e.preventDefault) {
          e.preventDefault();
        }

        if (e.stopPropagation) {
          e.stopPropagation();
        }

        currentY =
          clampY(
            currentY + 80
          );

        applyTransform();

        return false;
      }


      /*
       * DOWN ARROW
       *
       * Move text downward
       */

      if (
        code === 40 ||
        key === "ArrowDown" ||
        key === "Down"
      ) {

        if (e.preventDefault) {
          e.preventDefault();
        }

        if (e.stopPropagation) {
          e.stopPropagation();
        }

        currentY =
          clampY(
            currentY - 80
          );

        applyTransform();

        return false;
      }


      /*
       * E
       *
       * Change eye line
       */

      if (
        code === 69 ||
        key === "e" ||
        key === "E"
      ) {

        cycleEyeLine();

        return false;
      }


      /*
       * R
       *
       * Reset
       */

      if (
        code === 82 ||
        key === "r" ||
        key === "R"
      ) {

        resetPrompter();

        return false;
      }
    }


    /*
     * ==========================================================
     * KEYBOARD EVENT REGISTRATION
     * ==========================================================
     */

    if (window.addEventListener) {

      window.addEventListener(
        "keydown",
        handleKeyDown,
        true
      );

      document.addEventListener(
        "keydown",
        handleKeyDown,
        true
      );

    } else {

      window.onkeydown =
        handleKeyDown;

      document.onkeydown =
        handleKeyDown;
    }


    /*
     * ==========================================================
     * WINDOW LOAD
     * ==========================================================
     */

    window.onload =
      function() {

        document.body.focus();

        /*
         * Make sure the initial values
         * are displayed correctly.
         */

        speedVal.innerHTML =
          speed.toFixed(1) + "x";

        fontVal.innerHTML =
          fontSize + "px";

        prompterText.style.fontSize =
          fontSize + "px";

        updateTimers();
      };


    /*
     * ==========================================================
     * INITIAL TIMER
     * ==========================================================
     */

    updateTimers();

  </script>

</body>
</html>
