<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>UVISTIX WORDS Teleprompter</title>
  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #f1f5f9 !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      outline: none;
    }

    /* Fixed Top Control Bar */
    #header {
      background: #141414;
      padding: 6px 8px;
      border-bottom: 1px solid #333333;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      z-index: 100;
      overflow: hidden;
      opacity: 1;
      -webkit-transition: opacity 0.4s ease;
      transition: opacity 0.4s ease;
      white-space: nowrap;
    }

    #header.autohidden {
      opacity: 0;
      pointer-events: none;
    }

    .btn {
      background: #2b2b2b;
      color: #f1f5f9 !important;
      border: 1px solid #444444;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      -webkit-border-radius: 4px;
      float: left;
      margin-right: 5px;
      height: 34px;
      line-height: 24px;
      cursor: pointer;
      -webkit-appearance: none;
      outline: none !important;
    }

    .btn.active {
      background: #0070f3 !important;
    }

    #playBtn {
      background: #16a34a;
    }

    #playBtn.paused {
      background: #ea580c;
    }

    #playBtn.counting {
      background: #ca8a04;
    }

    /* Take Dropdown Selector */
    .dropdown-select {
      background: #1e293b;
      color: #38bdf8 !important;
      border: 1px solid #0284c7;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      -webkit-border-radius: 4px;
      float: left;
      margin-right: 8px;
      height: 34px;
      cursor: pointer;
      outline: none;
      -webkit-appearance: menulist;
    }

    .control-label {
      float: left;
      font-size: 12px;
      color: #f1f5f9 !important;
      line-height: 34px;
      margin-right: 5px;
    }

    .timer-box {
      float: right;
      font-family: monospace;
      font-size: 11px;
      background: #000000;
      padding: 4px 6px;
      border: 1px solid #333333;
      border-radius: 4px;
      -webkit-border-radius: 4px;
      color: #f1f5f9 !important;
      line-height: 24px;
      height: 34px;
    }

    /* Viewport Container */
    #prompterViewport {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      overflow: hidden;
      background: #000000;
      padding-left: 15px;
      padding-right: 15px;
      cursor: grab;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    /* Prompter Text Block */
    #prompterText {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      font-size: 44px;
      line-height: 1.45;
      font-weight: bold;
      text-align: center;
      color: #f1f5f9 !important;
      white-space: pre-wrap;
      word-wrap: break-word;
      outline: none;
      -webkit-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      padding-bottom: 30px;
    }

    /* Eye-Marker Side Chevrons (Positioned via JS based on eye-line setting) */
    .eye-chevron {
      position: absolute;
      top: 65%;
      font-size: 30px;
      line-height: 1;
      color: rgba(241, 245, 249, 0.45);
      z-index: 50;
      pointer-events: none;
      margin-top: -15px;
      -webkit-transition: top 0.25s ease;
      transition: top 0.25s ease;
    }

    #chevronLeft {
      left: 12px;
    }

    #chevronRight {
      right: 12px;
    }

    /* Subtle Eye-Line Guide Bar across the screen */
    #eyeGuideLine {
      position: absolute;
      top: 65%;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(56, 189, 248, 0.15);
      pointer-events: none;
      z-index: 40;
      -webkit-transition: top 0.25s ease;
      transition: top 0.25s ease;
    }

    /* Countdown Overlay */
    #countdownOverlay {
      display: none;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 90;
      text-align: center;
      padding-top: 140px;
    }

    #countdownNumber {
      font-size: 120px;
      font-weight: 900;
      color: #38bdf8;
      font-family: monospace;
      line-height: 1;
    }

    #countdownSubtext {
      font-size: 18px;
      color: #94a3b8;
      margin-top: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #skipCountdownBtn {
      margin-top: 20px;
      padding: 8px 20px;
      font-size: 14px;
      background: #333333;
      border: 1px solid #555555;
      color: #f1f5f9;
      border-radius: 4px;
      -webkit-border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body tabindex="0">

  <!-- Top Control Bar -->

    <button id="playBtn" class="btn" tabindex="-1">Play</button>

    <button id="widthBtn" class="btn" tabindex="-1">W: Mid</button>

    <button id="mirrorBtn" class="btn" tabindex="-1">Mirror</button>
    <button id="reverseBtn" class="btn" tabindex="-1">Reverse</button>
    <button id="fullscreenBtn" class="btn" tabindex="-1">Full</button>

    <div id="timerDisplay" class="timer-box">00:00.0 / 00:00.0</div>
  </div>

  <div id="eyeGuideLine"></div>
  <div id="chevronLeft" class="eye-chevron">&#x25BA;</div>

  <!-- Countdown Overlay -->

    var currentWidthIdx = 1;

    // Remove Fullscreen button on devices without Fullscreen API (iOS 5 Safari)
    var supportsFullscreen = document.documentElement.requestFullscreen || 
                             document.documentElement.webkitRequestFullscreen || 
                             document.documentElement.mozRequestFullScreen;
    if (!supportsFullscreen) {
      fullscreenBtn.style.display = "none";
    }

    // Prevent tap focus highlight traps on iOS Safari
    var buttons = document.getElementsByTagName("button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].onmouseup = function() { this.blur(); };
      buttons[i].onclick = function() { this.blur(); };
    }

    // Populate Available Takes (Part 1 to 6)
    var availableParts = [];
    for (var p = 1; p <= 6; p++) {
      var val = window["SCRIPT_PART_" + p];
      if (typeof val === "string" && val.replace(/^\s+|\s+$/g, '') !== "") {
        availableParts.push({ label: "Part " + p, content: val });
      }
    }

    if (availableParts.length === 0 && typeof TELEPROMPTER_SCRIPT !== "undefined") {
      availableParts.push({ label: "Full Script", content: TELEPROMPTER_SCRIPT });
    }

    partSelector.innerHTML = "";
    if (availableParts.length > 0) {
      for (var j = 0; j < availableParts.length; j++) {
        var opt = document.createElement("option");
        opt.value = j;
        opt.text = availableParts[j].label;
        partSelector.appendChild(opt);
      }
      prompterText.innerHTML = availableParts[0].content.replace(/\n/g, "<br/>");
      partSelector.style.display = (availableParts.length > 1) ? "block" : "none";
    } else {
      partSelector.style.display = "none";
      prompterText.innerHTML = "No script found.";
    }

    /* Update Eye-line markers and screen positioning */
    function updateEyeLineVisuals() {
      var pct = Math.round(eyeLinePositions[currentEyeLineIdx].ratio * 100);
      chevronLeft.style.top = pct + "%";
      chevronRight.style.top = pct + "%";
      eyeGuideLine.style.top = pct + "%";
      eyeLineBtn.innerHTML = eyeLinePositions[currentEyeLineIdx].label;
    }

    function switchPart(idx) {
      if (availableParts[idx]) {
        partSelector.value = idx;
        prompterText.innerHTML = availableParts[idx].content.replace(/\n/g, "<br/>");
        resetPrompter();
      }
    }

    partSelector.onchange = function() {
      switchPart(parseInt(this.value, 10));
      this.blur();
    };

    /* Start Offset aligned with the user's camera placement ratio */
    function getStartOffset() {
      var viewH = window.innerHeight || 768;
      var ratio = eyeLinePositions[currentEyeLineIdx].ratio;
      return Math.floor(viewH * ratio);
    }

    function getMinY() {
      var viewH = window.innerHeight || 768;
      var textH = prompterText.offsetHeight || 0;
      var eyeLine = getStartOffset();
      var endLimit = eyeLine - textH;
      return Math.min(getStartOffset(), endLimit);
    }

    function clampY(val) {
      var maxY = getStartOffset();
      var minY = getMinY();
      if (val > maxY) return maxY;
      if (val < minY) return minY;
      return val;
    }

    function applyTransform() {
      var scaleX = isMirrored ? -1 : 1;
      var scaleY = isReversed ? -1 : 1;
      var transformStr = "translate3d(0px, " + Math.round(currentY) + "px, 0px) scale(" + scaleX + ", " + scaleY + ")";
      prompterText.style.webkitTransform = transformStr;
      prompterText.style.transform = transformStr;
    }

    function showHeader() {
      header.className = "";
      if (hideHeaderTimeout) clearTimeout(hideHeaderTimeout);
      
      if (isPlaying) {
        hideHeaderTimeout = setTimeout(function() {
          header.className = "autohidden";
        }, 2500);
      }
    }

    window.onmousemove = showHeader;
    window.ontouchstart = showHeader;

    function resetPrompter() {
      stopCountdown();
      togglePlay(false);
      currentY = getStartOffset();
      elapsedMs = 0;
      applyTransform();
      updateTimers();
      showHeader();
    }

    // Set initial position
    updateEyeLineVisuals();
    currentY = getStartOffset();
    applyTransform();

    function formatTimeMs(totalMs) {
      if (totalMs < 0) totalMs = 0;
      var minutes = Math.floor(totalMs / 60000);
      var seconds = Math.floor((totalMs % 60000) / 1000);
      var tenths = Math.floor((totalMs % 1000) / 100);
      return (minutes < 10 ? "0" + minutes : minutes) + ":" +
             (seconds < 10 ? "0" + seconds : seconds) + "." + tenths;
    }

    function updateTimers() {
      var textH = prompterText.offsetHeight || 1000;
      var pxPerMs = (speed * 25) / 1000;
      var totalEstimatedMs = (textH / pxPerMs);
      timerDisplay.innerHTML = formatTimeMs(elapsedMs) + " / " + formatTimeMs(totalEstimatedMs);
    }

    function stepScroll() {
      if (!isPlaying) return;
      var step = (speed * 25) * 0.03;
      elapsedMs += 30;

      if (isReversed) {
        currentY += step;
        if (currentY >= getStartOffset()) {
          currentY = getStartOffset();
          applyTransform();
          togglePlay(false);
          updateTimers();
          return;
        }
      } else {
        currentY -= step;
        var minY = getMinY();
        if (currentY <= minY) {
          currentY = minY;
          applyTransform();
          togglePlay(false);
          updateTimers();
          return;
        }
      }

      applyTransform();
      updateTimers();
    }

    function stopCountdown() {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      isCountingDown = false;
      countdownOverlay.style.display = "none";
    }

    function startCountdown() {
      stopCountdown();
      isCountingDown = true;
      countdownValue = 5;
      countdownNumber.innerHTML = countdownValue;
      countdownOverlay.style.display = "block";

      playBtn.innerHTML = "Cancel (5s)";
      playBtn.className = "btn counting";

      countdownTimer = setInterval(function() {
        countdownValue--;
        if (countdownValue > 0) {
          countdownNumber.innerHTML = countdownValue;
        } else {
          stopCountdown();
          startActualScroll();
        }
      }, 1000);
    }

    function startActualScroll() {
      isPlaying = true;
      playBtn.innerHTML = "Pause";
      playBtn.className = "btn paused";
      if (scrollInterval) clearInterval(scrollInterval);
      scrollInterval = setInterval(stepScroll, 30);
      showHeader();
    }

    function togglePlay(forceState) {
      if (isCountingDown) {
        stopCountdown();
        playBtn.innerHTML = "Play";
        playBtn.className = "btn";
        showHeader();
        return;
      }

      var target = (typeof forceState !== "undefined") ? forceState : !isPlaying;

      if (target) {
        startCountdown();
      } else {
        isPlaying = false;
        playBtn.innerHTML = "Play";
        playBtn.className = "btn";
        if (scrollInterval) clearInterval(scrollInterval);
        showHeader();
      }
    }

    skipCountdownBtn.onclick = function() {
      stopCountdown();
      startActualScroll();
      this.blur();
    };

    function cycleWidth() {
      currentWidthIdx = (currentWidthIdx + 1) % widths.length;
      prompterText.style.maxWidth = widths[currentWidthIdx].size;
      widthBtn.innerHTML = widths[currentWidthIdx].label;
      currentY = clampY(currentY);
      applyTransform();
      updateTimers();
    }

    /* Cycle Eye-Line placement (65% -> 75% -> 40% -> 52%) */
    function cycleEyeLine() {
      var oldRatio = eyeLinePositions[currentEyeLineIdx].ratio;
      currentEyeLineIdx = (currentEyeLineIdx + 1) % eyeLinePositions.length;
      var newRatio = eyeLinePositions[currentEyeLineIdx].ratio;

      updateEyeLineVisuals();

      // Adjust current scroll location dynamically
      var viewH = window.innerHeight || 768;
      var shiftPx = Math.floor(viewH * (newRatio - oldRatio));
      currentY = clampY(currentY + shiftPx);
      applyTransform();
      updateTimers();
    }

    eyeLineBtn.onclick = function() {
      cycleEyeLine();
      this.blur();
    };

    // Touch dragging compatible with Mobile Safari iOS 5
    var touchStartY = 0;
    var touchStartCurrentY = 0;
    var isDragging = false;

    viewport.ontouchstart = function(e) {
      showHeader();
      if (e.touches && e.touches.length === 1) {
        touchStartY = e.touches[0].pageY;
        touchStartCurrentY = currentY;
        isDragging = true;
      }
    };

    viewport.ontouchmove = function(e) {
      if (isDragging && e.touches && e.touches.length === 1) {
        if (e.preventDefault) e.preventDefault();
        var touchCurrentY = e.touches[0].pageY;
        var deltaY = touchCurrentY - touchStartY;
        currentY = clampY(touchStartCurrentY + deltaY);
        applyTransform();
      }
    };

    viewport.ontouchend = function() { isDragging = false; };
    viewport.ontouchcancel = function() { isDragging = false; };

    viewport.onmousedown = function(e) {
      showHeader();
      e = e || window.event;
      touchStartY = e.pageY || e.clientY;
      touchStartCurrentY = currentY;
      isDragging = true;
    };

    window.onmousemove = function(e) {
      showHeader();
      if (isDragging) {
        e = e || window.event;
        var mouseY = e.pageY || e.clientY;
        var deltaY = mouseY - touchStartY;
        currentY = clampY(touchStartCurrentY + deltaY);
        applyTransform();
      }
    };

    window.onmouseup = function() {
      isDragging = false;
    };

    function handleWheel(e) {
      e = e || window.event;
      if (e.preventDefault) e.preventDefault();
      showHeader();
      var delta = e.deltaY || -e.wheelDelta || 0;
      currentY = clampY(currentY - delta * 0.8);
      applyTransform();
    }

    if (viewport.addEventListener) {
      viewport.addEventListener("wheel", handleWheel, false);
      viewport.addEventListener("mousewheel", handleWheel, false);
      viewport.addEventListener("DOMMouseScroll", handleWheel, false);
    } else {
      viewport.onmousewheel = handleWheel;
    }

    function setAlignment(alignment) {
      prompterText.style.textAlign = alignment;
      alignLeftBtn.className = alignment === "left" ? "btn active" : "btn";
      alignCenterBtn.className = alignment === "center" ? "btn active" : "btn";
      alignRightBtn.className = alignment === "right" ? "btn active" : "btn";
    }

    playBtn.onclick = function() { togglePlay(); this.blur(); };
    resetBtn.onclick = function() { resetPrompter(); this.blur(); };
    alignLeftBtn.onclick = function() { setAlignment("left"); this.blur(); };
    alignCenterBtn.onclick = function() { setAlignment("center"); this.blur(); };
    alignRightBtn.onclick = function() { setAlignment("right"); this.blur(); };

    speedDownBtn.onclick = function() {
      if (speed > 0.3) speed = +(speed - 0.2).toFixed(1);
      speedVal.innerHTML = speed + "x";
      updateTimers();
      this.blur();
    };

    speedUpBtn.onclick = function() {
      if (speed < 8.0) speed = +(speed + 0.2).toFixed(1);
      speedVal.innerHTML = speed + "x";
      updateTimers();
      this.blur();
    };

    fontDownBtn.onclick = function() {
      if (fontSize > 18) fontSize -= 4;
      prompterText.style.fontSize = fontSize + "px";
      currentY = clampY(currentY);
      applyTransform();
      updateTimers();
      this.blur();
    };

    fontUpBtn.onclick = function() {
      if (fontSize < 100) fontSize += 4;
      prompterText.style.fontSize = fontSize + "px";
      currentY = clampY(currentY);
      applyTransform();
      updateTimers();
      this.blur();
    };

    widthBtn.onclick = function() { cycleWidth(); this.blur(); };

    mirrorBtn.onclick = function() {
      isMirrored = !isMirrored;
      mirrorBtn.className = isMirrored ? "btn active" : "btn";
      applyTransform();
      this.blur();
    };

    reverseBtn.onclick = function() {
      isReversed = !isReversed;
      reverseBtn.className = isReversed ? "btn active" : "btn";
      applyTransform();
      this.blur();
    };

    fullscreenBtn.onclick = function() {
      var doc = document.documentElement;
      var isFull = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;

      if (!isFull) {
        if (doc.requestFullscreen) doc.requestFullscreen();
        else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
      this.blur();
    };

    // Keyboard & Wireless Remote Navigation
    function handleKeyDown(e) {
      e = e || window.event;
      var code = e.keyCode || e.which;
      var key = e.key || "";

      showHeader();

      // Number keys 1-6 (Top Row and Numpad) -> Jump Part
      if ((code >= 49 && code <= 54) || (code >= 97 && code <= 102)) {
        var partNum = (code >= 97) ? (code - 96) : (code - 48);
        var partIdx = partNum - 1;
        if (availableParts[partIdx]) {
          switchPart(partIdx);
          return false;
        }
      }

      // SPACEBAR -> Play / Pause
      if (code === 32 || key === " " || key === "Spacebar") {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
        togglePlay();
        return false;
      }

      // UP ARROW -> Nudge Up / Rewind
      if (code === 38 || key === "ArrowUp" || key === "Up") {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
        currentY = clampY(currentY + 80);
        applyTransform();
        return false;
      }

      // DOWN ARROW -> Nudge Down / Advance
      if (code === 40 || key === "ArrowDown" || key === "Down") {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
        currentY = clampY(currentY - 80);
        applyTransform();
        return false;
      }

      // 'E' or 'e' -> Toggle Eye-Line Camera Position
      if (code === 69 || key === "e" || key === "E") {
        cycleEyeLine();
        return false;
      }

      // 'R' or 'r' -> Reset
      if (code === 82 || key === "r" || key === "R") {
        resetPrompter();
        return false;
      }
    }

    if (window.addEventListener) {
      window.addEventListener("keydown", handleKeyDown, true);
      document.addEventListener("keydown", handleKeyDown, true);
    } else {
      window.onkeydown = handleKeyDown;
      document.onkeydown = handleKeyDown;
    }

    window.onload = function() {
      document.body.focus();
    };

    updateTimers();
  </script>
</body>
</html>
