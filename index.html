<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Teleprompter</title>
  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #f1f5f9 !important; /* Calibrated off-white: avoids beam-splitter light scatter */
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; /* Crisp text edges on iPad 1 non-Retina displays */
      -moz-osx-font-smoothing: grayscale;
    }

    /* Fixed Top Control Bar with Auto-Hide Transition */
    #header {
      background: #141414;
      padding: 6px 8px;
      border-bottom: 1px solid #333333;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      z-index: 100;
      overflow: hidden;
      opacity: 1;
      -webkit-transition: opacity 0.4s ease;
      transition: opacity 0.4s ease;
    }

    /* Hidden state for glass beam-splitter protection */
    #header.autohidden {
      opacity: 0;
      pointer-events: none;
    }

    .btn {
      background: #2b2b2b;
      color: #f1f5f9 !important;
      border: 1px solid #444444;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      float: left;
      margin-right: 5px;
      height: 34px;
      line-height: 24px;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .btn.active {
      background: #0070f3 !important;
    }

    #playBtn {
      background: #16a34a;
    }

    #playBtn.paused {
      background: #ea580c;
    }

    #playBtn.counting {
      background: #ca8a04;
    }

    .control-label {
      float: left;
      font-size: 12px;
      color: #f1f5f9 !important;
      line-height: 34px;
      margin-right: 5px;
    }

    .timer-box {
      float: right;
      font-family: monospace;
      font-size: 11px;
      background: #000000;
      padding: 4px 6px;
      border: 1px solid #333333;
      border-radius: 4px;
      color: #f1f5f9 !important;
      line-height: 24px;
      height: 34px;
    }

    /* Viewport Container */
    #prompterViewport {
      position: absolute;
      top: 0px;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      overflow: hidden;
      background: #000000;
      padding-left: 15px;
      padding-right: 15px;
      cursor: grab;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Prompter Text Block */
    #prompterText {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      font-size: 44px;
      line-height: 1.45;
      font-weight: 700;
      text-align: center;
      color: #f1f5f9 !important;
      white-space: pre-wrap;
      word-wrap: break-word;
      outline: none;
      -webkit-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
      /* Item 1: Last Line Spacer — allows final sentences to reach 40% eye-line */
      padding-bottom: 75vh;
    }

    /* Eye-Marker Side Chevrons */
    .eye-chevron {
      position: absolute;
      top: 40%;
      font-size: 30px;
      line-height: 1;
      color: rgba(241, 245, 249, 0.45);
      z-index: 50;
      pointer-events: none;
      margin-top: -15px;
    }

    #chevronLeft {
      left: 12px;
    }

    #chevronRight {
      right: 12px;
    }

    /* Countdown Overlay */
    #countdownOverlay {
      display: none;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 90;
      text-align: center;
      padding-top: 140px;
    }

    #countdownNumber {
      font-size: 110px;
      font-weight: 900;
      color: #38bdf8;
      font-family: monospace;
      line-height: 1;
    }

    #countdownSubtext {
      font-size: 18px;
      color: #94a3b8;
      margin-top: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #skipCountdownBtn {
      margin-top: 20px;
      padding: 6px 16px;
      font-size: 14px;
      background: #333333;
      border: 1px solid #555555;
      color: #f1f5f9;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>

  <script src="script.js"></script>
</head>
<body>

  <!-- Top Control Bar -->
  <div id="header">
    <button id="playBtn" class="btn">Play</button>
    <button id="resetBtn" class="btn">Reset</button>

    <button id="alignLeftBtn" class="btn">Left</button>
    <button id="alignCenterBtn" class="btn active">Center</button>
    <button id="alignRightBtn" class="btn">Right</button>

    <span class="control-label">Spd:</span>
    <button id="speedDownBtn" class="btn">-</button>
    <button id="speedUpBtn" class="btn">+</button>
    <span id="speedVal" class="control-label" style="font-weight:bold;">1.5x</span>

    <span class="control-label">Font:</span>
    <button id="fontDownBtn" class="btn">A-</button>
    <button id="fontUpBtn" class="btn">A+</button>

    <button id="widthBtn" class="btn">W: Mid</button>

    <button id="mirrorBtn" class="btn">Mirror</button>
    <button id="reverseBtn" class="btn">Reverse</button>
    <button id="fullscreenBtn" class="btn">Full</button>

    <div id="timerDisplay" class="timer-box">00:00.0 / 00:00.0</div>
  </div>

  <!-- Reading Eye Chevrons -->
  <div id="chevronLeft" class="eye-chevron">&#x25BA;</div>
  <div id="chevronRight" class="eye-chevron">&#x25C4;</div>

  <!-- Countdown Overlay -->
  <div id="countdownOverlay">
    <div id="countdownNumber">10</div>
    <div id="countdownSubtext">Starting in...</div>
    <button id="skipCountdownBtn">Start Now</button>
  </div>

  <!-- Prompter Text Surface -->
  <div id="prompterViewport">
    <div id="prompterText"></div>
  </div>

  <script>
    var header = document.getElementById("header");
    var viewport = document.getElementById("prompterViewport");
    var prompterText = document.getElementById("prompterText");
    var playBtn = document.getElementById("playBtn");
    var resetBtn = document.getElementById("resetBtn");
    var alignLeftBtn = document.getElementById("alignLeftBtn");
    var alignCenterBtn = document.getElementById("alignCenterBtn");
    var alignRightBtn = document.getElementById("alignRightBtn");
    var speedDownBtn = document.getElementById("speedDownBtn");
    var speedUpBtn = document.getElementById("speedUpBtn");
    var speedVal = document.getElementById("speedVal");
    var fontDownBtn = document.getElementById("fontDownBtn");
    var fontUpBtn = document.getElementById("fontUpBtn");
    var widthBtn = document.getElementById("widthBtn");
    var mirrorBtn = document.getElementById("mirrorBtn");
    var reverseBtn = document.getElementById("reverseBtn");
    var fullscreenBtn = document.getElementById("fullscreenBtn");
    var timerDisplay = document.getElementById("timerDisplay");

    var countdownOverlay = document.getElementById("countdownOverlay");
    var countdownNumber = document.getElementById("countdownNumber");
    var skipCountdownBtn = document.getElementById("skipCountdownBtn");

    var isPlaying = false;
    var isCountingDown = false;
    var countdownTimer = null;
    var countdownValue = 10;
    var scrollInterval = null;
    var elapsedMs = 0;
    var speed = 1.5;
    var fontSize = 44;
    var currentY = 0;
    var isMirrored = false;
    var isReversed = false;

    var hideHeaderTimeout = null;

    var widths = [
      { size: "400px", label: "W: Nar" },
      { size: "520px", label: "W: Mid" },
      { size: "100%",  label: "W: Full" }
    ];
    var currentWidthIdx = 1;

    if (typeof TELEPROMPTER_SCRIPT !== "undefined" && TELEPROMPTER_SCRIPT !== "") {
      prompterText.innerHTML = TELEPROMPTER_SCRIPT.replace(/\n/g, "<br/>");
    } else {
      prompterText.innerHTML = "No script found. Make sure script.js exists in your repository with TELEPROMPTER_SCRIPT defined.";
    }

    function getStartOffset() {
      var viewH = window.innerHeight || document.documentElement.clientHeight || 768;
      return Math.floor(viewH * 0.35);
    }

    function applyTransform() {
      var scaleX = isMirrored ? -1 : 1;
      var scaleY = isReversed ? -1 : 1;
      var transformStr = "translate3d(0px, " + currentY + "px, 0px) scale(" + scaleX + ", " + scaleY + ")";
      
      prompterText.style.webkitTransform = transformStr;
      prompterText.style.transform = transformStr;
    }

    function showHeader() {
      header.className = "";
      if (hideHeaderTimeout) clearTimeout(hideHeaderTimeout);
      
      if (isPlaying) {
        hideHeaderTimeout = setTimeout(function() {
          header.className = "autohidden";
        }, 2500);
      }
    }

    window.onmousemove = showHeader;
    window.ontouchstart = showHeader;

    function resetPrompter() {
      stopCountdown();
      togglePlay(false);
      currentY = getStartOffset();
      elapsedMs = 0;
      applyTransform();
      updateTimers();
      showHeader();
    }

    currentY = getStartOffset();
    applyTransform();

    function formatTimeMs(totalMs) {
      var minutes = Math.floor(totalMs / 60000);
      var seconds = Math.floor((totalMs % 60000) / 1000);
      var tenths = Math.floor((totalMs % 1000) / 100);
      return (minutes < 10 ? "0" + minutes : minutes) + ":" +
             (seconds < 10 ? "0" + seconds : seconds) + "." + tenths;
    }

    function updateTimers() {
      var textH = prompterText.offsetHeight || 1000;
      var pxPerMs = (speed * 25) / 1000;
      var totalEstimatedMs = (textH / pxPerMs);
      timerDisplay.innerHTML = formatTimeMs(elapsedMs) + " / " + formatTimeMs(totalEstimatedMs);
    }

    function stepScroll() {
      if (!isPlaying) return;
      var step = (speed * 25) * 0.03;
      elapsedMs += 30;

      if (isReversed) {
        currentY += step;
      } else {
        currentY -= step;
      }

      applyTransform();

      var textH = prompterText.offsetHeight || 1000;
      if (Math.abs(currentY) > (textH + 400)) {
        togglePlay(false);
      }

      updateTimers();
    }

    function stopCountdown() {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      isCountingDown = false;
      countdownOverlay.style.display = "none";
    }

    function startCountdown() {
      stopCountdown();
      isCountingDown = true;
      countdownValue = 10;
      countdownNumber.innerHTML = countdownValue;
      countdownOverlay.style.display = "block";

      playBtn.innerHTML = "Cancel (10s)";
      playBtn.className = "btn counting";

      countdownTimer = setInterval(function() {
        countdownValue--;
        if (countdownValue > 0) {
          countdownNumber.innerHTML = countdownValue;
        } else {
          stopCountdown();
          startActualScroll();
        }
      }, 1000);
    }

    function startActualScroll() {
      isPlaying = true;
      playBtn.innerHTML = "Pause";
      playBtn.className = "btn paused";
      if (scrollInterval) clearInterval(scrollInterval);
      scrollInterval = setInterval(stepScroll, 30);
      showHeader();
    }

    function togglePlay(forceState) {
      if (isCountingDown) {
        stopCountdown();
        playBtn.innerHTML = "Play";
        playBtn.className = "btn";
        showHeader();
        return;
      }

      var target = forceState !== undefined ? forceState : !isPlaying;

      if (target) {
        startCountdown();
      } else {
        isPlaying = false;
        playBtn.innerHTML = "Play";
        playBtn.className = "btn";
        if (scrollInterval) clearInterval(scrollInterval);
        showHeader();
      }
    }

    skipCountdownBtn.onclick = function() {
      stopCountdown();
      startActualScroll();
    };

    function cycleWidth() {
      currentWidthIdx = (currentWidthIdx + 1) % widths.length;
      prompterText.style.maxWidth = widths[currentWidthIdx].size;
      widthBtn.innerHTML = widths[currentWidthIdx].label;
      updateTimers();
    }

    /* Manual Drag / Touch */
    var touchStartY = 0;
    var touchStartCurrentY = 0;
    var isDragging = false;

    viewport.ontouchstart = function(e) {
      showHeader();
      if (e.touches && e.touches.length === 1) {
        touchStartY = e.touches[0].pageY;
        touchStartCurrentY = currentY;
        isDragging = true;
      }
    };

    viewport.ontouchmove = function(e) {
      if (isDragging && e.touches && e.touches.length === 1) {
        if (e.preventDefault) e.preventDefault();
        var touchCurrentY = e.touches[0].pageY;
        var deltaY = touchCurrentY - touchStartY;
        currentY = touchStartCurrentY + deltaY;
        applyTransform();
      }
    };

    viewport.ontouchend = function() {
      isDragging = false;
    };

    viewport.onmousedown = function(e) {
      showHeader();
      touchStartY = e.pageY;
      touchStartCurrentY = currentY;
      isDragging = true;
    };

    window.onmousemove = function(e) {
      showHeader();
      if (isDragging) {
        var deltaY = e.pageY - touchStartY;
        currentY = touchStartCurrentY + deltaY;
        applyTransform();
      }
    };

    window.onmouseup = function() {
      isDragging = false;
    };

    function handleWheel(e) {
      e = e || window.event;
      if (e.preventDefault) e.preventDefault();
      showHeader();
      var delta = e.deltaY || -e.wheelDelta || 0;
      currentY -= delta * 0.8;
      applyTransform();
    }

    if (viewport.addEventListener) {
      viewport.addEventListener("wheel", handleWheel, false);
      viewport.addEventListener("mousewheel", handleWheel, false);
      viewport.addEventListener("DOMMouseScroll", handleWheel, false);
    } else {
      viewport.onmousewheel = handleWheel;
    }

    /* Button Action Handlers */
    function setAlignment(alignment) {
      prompterText.style.textAlign = alignment;
      alignLeftBtn.className = alignment === "left" ? "btn active" : "btn";
      alignCenterBtn.className = alignment === "center" ? "btn active" : "btn";
      alignRightBtn.className = alignment === "right" ? "btn active" : "btn";
    }

    playBtn.onclick = function() { togglePlay(); };
    resetBtn.onclick = resetPrompter;

    alignLeftBtn.onclick = function() { setAlignment("left"); };
    alignCenterBtn.onclick = function() { setAlignment("center"); };
    alignRightBtn.onclick = function() { setAlignment("right"); };

    speedDownBtn.onclick = function() {
      if (speed > 0.3) speed = +(speed - 0.2).toFixed(1);
      speedVal.innerHTML = speed + "x";
      updateTimers();
    };

    speedUpBtn.onclick = function() {
      if (speed < 8.0) speed = +(speed + 0.2).toFixed(1);
      speedVal.innerHTML = speed + "x";
      updateTimers();
    };

    fontDownBtn.onclick = function() {
      if (fontSize > 18) fontSize -= 4;
      prompterText.style.fontSize = fontSize + "px";
      updateTimers();
    };

    fontUpBtn.onclick = function() {
      if (fontSize < 100) fontSize += 4;
      prompterText.style.fontSize = fontSize + "px";
      updateTimers();
    };

    widthBtn.onclick = cycleWidth;

    mirrorBtn.onclick = function() {
      isMirrored = !isMirrored;
      mirrorBtn.className = isMirrored ? "btn active" : "btn";
      applyTransform();
    };

    reverseBtn.onclick = function() {
      isReversed = !isReversed;
      reverseBtn.className = isReversed ? "btn active" : "btn";
      applyTransform();
    };

    fullscreenBtn.onclick = function() {
      var doc = document.documentElement;
      var isFull = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;

      if (!isFull) {
        if (doc.requestFullscreen) doc.requestFullscreen();
        else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) doc.exitFullscreen();
        else if (document.webkitExitFullscreen) doc.webkitExitFullscreen();
      }
    };

    /* -------------------------------------------------------------
   REPLACE YOUR window.onkeydown BLOCK & BUTTON LISTENERS WITH THIS
------------------------------------------------------------- */

// 1. Prevent buttons from stealing keyboard focus when clicked
var allButtons = document.getElementsByTagName("button");
for (var b = 0; b < allButtons.length; b++) {
  allButtons[b].addEventListener("focus", function() {
    this.blur(); // Drops focus back to the page immediately
  });
}

// 2. Universal Keyboard & Remote Clicker Handler
function handleKeyPress(e) {
  e = e || window.event;
  showHeader();

  var code = e.keyCode || e.which;
  var key = e.key || "";

  // Spacebar or Clicker 'B' / Blank button -> Play / Pause
  if (code === 32 || key === " " || key === "Spacebar" || code === 66 || key === "b" || key === "B") {
    if (e.preventDefault) e.preventDefault();
    togglePlay();
    return false;
  }

  // Up Arrow -> Speed Up
  if (code === 38 || key === "ArrowUp" || key === "Up") {
    if (e.preventDefault) e.preventDefault();
    speedUpBtn.click();
    return false;
  }

  // Down Arrow -> Speed Down
  if (code === 40 || key === "ArrowDown" || key === "Down") {
    if (e.preventDefault) e.preventDefault();
    speedDownBtn.click();
    return false;
  }

  // PageUp (Clicker Previous) -> Nudge text backward
  if (code === 33 || key === "PageUp") {
    if (e.preventDefault) e.preventDefault();
    currentY += 120;
    applyTransform();
    return false;
  }

  // PageDown (Clicker Next) -> Nudge text forward
  if (code === 34 || key === "PageDown") {
    if (e.preventDefault) e.preventDefault();
    currentY -= 120;
    applyTransform();
    return false;
  }

  // 'R' Key -> Reset
  if (code === 82 || key === "r" || key === "R") {
    resetPrompter();
  }

  // 'F' Key -> Fullscreen
  if (code === 70 || key === "f" || key === "F") {
    fullscreenBtn.click();
  }

  // 'M' Key -> Mirror Toggle
  if (code === 77 || key === "m" || key === "M") {
    mirrorBtn.click();
  }
}

// 3. Attach to both document and window with event capturing
if (document.addEventListener) {
  document.addEventListener("keydown", handleKeyPress, true);
  window.addEventListener("keydown", handleKeyPress, true);
} else {
  document.onkeydown = handleKeyPress;
  window.onkeydown = handleKeyPress;
}

// 4. Set focus to body on initial load and click
document.body.setAttribute("tabindex", "0");
document.body.focus();

window.onclick = function() {
  document.body.focus();
};

    updateTimers();
  </script>
</body>
</html>
