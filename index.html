<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>UVISTIX WORDS Teleprompter</title>

  <style>

    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #f1f5f9;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      outline: none;
    }


    /* =========================================================
       TOP CONTROL BAR
       ========================================================= */

    #header {
      background: #141414;

      padding: 6px 8px;

      border-bottom: 1px solid #333333;

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 48px;

      z-index: 100;

      overflow: hidden;

      opacity: 1;

      -webkit-transition: opacity 0.4s ease;
      transition: opacity 0.4s ease;

      white-space: nowrap;
    }


    #header.autohidden {
      opacity: 0;
      pointer-events: none;
    }


    .btn {
      background: #2b2b2b;

      color: #f1f5f9;

      border: 1px solid #444444;

      padding: 4px 8px;

      font-size: 13px;

      font-weight: bold;

      border-radius: 4px;
      -webkit-border-radius: 4px;

      float: left;

      margin-right: 5px;

      height: 34px;

      line-height: 24px;

      cursor: pointer;

      -webkit-appearance: none;

      outline: none;
    }


    .btn.active {
      background: #0070f3;
    }


    #playBtn {
      background: #16a34a;
    }


    #playBtn.paused {
      background: #ea580c;
    }


    #playBtn.counting {
      background: #ca8a04;
    }


    /* =========================================================
       PART SELECTOR
       ========================================================= */

    .dropdown-select {
      background: #1e293b;

      color: #38bdf8;

      border: 1px solid #0284c7;

      padding: 4px 8px;

      font-size: 13px;

      font-weight: bold;

      border-radius: 4px;
      -webkit-border-radius: 4px;

      float: left;

      margin-right: 8px;

      height: 34px;

      cursor: pointer;

      outline: none;

      -webkit-appearance: menulist;
    }


    .control-label {
      float: left;

      font-size: 12px;

      color: #f1f5f9;

      line-height: 34px;

      margin-right: 5px;
    }


    .timer-box {
      float: right;

      font-family: monospace;

      font-size: 11px;

      background: #000000;

      padding: 4px 6px;

      border: 1px solid #333333;

      border-radius: 4px;
      -webkit-border-radius: 4px;

      color: #f1f5f9;

      line-height: 24px;

      height: 34px;
    }


    /* =========================================================
       PROMPTER VIEWPORT
       ========================================================= */

    #prompterViewport {
      position: absolute;

      top: 0;
      bottom: 0;
      left: 0;
      right: 0;

      width: 100%;

      overflow: hidden;

      background: #000000;

      padding-left: 15px;
      padding-right: 15px;

      cursor: pointer;

      -webkit-user-select: none;
      user-select: none;

      outline: none;

      -webkit-tap-highlight-color: transparent;
    }


    /* =========================================================
       PROMPTER TEXT
       ========================================================= */

    #prompterText {
      width: 100%;

      max-width: 520px;

      margin: 0 auto;

      /*
        DEFAULT FONT SIZE

        44px

        A-:
        44
        40
        36
        32
        28

        So four A- taps = 28px.
      */

      font-size: 44px;

      line-height: 1.45;

      font-weight: bold;

      text-align: center;

      color: #f1f5f9;

      outline: none;

      -webkit-transform:
        translate3d(0, 0, 0);

      transform:
        translate3d(0, 0, 0);

      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;

      padding-top: 0;
      padding-bottom: 120px;
    }


    .script-line {
      display: block;

      min-height: 1.45em;
    }


    .script-blank {
      display: block;

      height: 0.65em;

      min-height: 0.65em;
    }


    /* =========================================================
       EYE LINE
       ========================================================= */

    .eye-chevron {
      position: absolute;

      top: 65%;

      font-size: 30px;

      line-height: 1;

      color:
        rgba(241, 245, 249, 0.45);

      z-index: 50;

      pointer-events: none;

      margin-top: -15px;

      -webkit-transition:
        top 0.25s ease;

      transition:
        top 0.25s ease;
    }


    #chevronLeft {
      left: 12px;
    }


    #chevronRight {
      right: 12px;
    }


    #eyeGuideLine {
      position: absolute;

      top: 65%;
      left: 0;

      width: 100%;
      height: 1px;

      background:
        rgba(56, 189, 248, 0.15);

      pointer-events: none;

      z-index: 40;

      -webkit-transition:
        top 0.25s ease;

      transition:
        top 0.25s ease;
    }


    /* =========================================================
       COUNTDOWN
       ========================================================= */

    #countdownOverlay {
      display: none;

      position: absolute;

      top: 0;
      bottom: 0;
      left: 0;
      right: 0;

      background:
        rgba(0, 0, 0, 0.85);

      z-index: 90;

      text-align: center;

      padding-top: 140px;
    }


    #countdownNumber {
      font-size: 120px;

      font-weight: 900;

      color: #38bdf8;

      font-family: monospace;

      line-height: 1;
    }


    #countdownSubtext {
      font-size: 18px;

      color: #94a3b8;

      margin-top: 10px;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    #skipCountdownBtn {
      margin-top: 20px;

      padding: 8px 20px;

      font-size: 14px;

      background: #333333;

      border: 1px solid #555555;

      color: #f1f5f9;

      border-radius: 4px;
      -webkit-border-radius: 4px;

      cursor: pointer;
    }

  </style>

</head>


<body tabindex="0">

    </span>


    <button

      tabindex="-1">

    </button>


    <button
      id="fontUpBtn"
      class="btn"
      tabindex="-1">

    </button>


    <span
      id="fontVal"
      class="control-label"
      style="font-weight:bold;">

    </span>


    <button

      class="btn"
      tabindex="-1">

    </button>


    <button

      class="btn"

    <button

    <button

    <div

    </div>

  </div>


  <!-- =========================================================
       EYE LINE
       ========================================================= -->

  <div id="eyeGuideLine"></div>

  <div
    id="chevronLeft"
    class="eye-chevron">
    &#x25BA;
  </div>

  <div
    id="chevronRight"
    class="eye-chevron">
    &#x25C4;
  </div>


  <!-- =========================================================
       COUNTDOWN
       ========================================================= -->

  <div id="countdownOverlay">

    <div id="countdownNumber">
      5
    </div>

    <div id="countdownSubtext">
      Starting in...
    </div>

    <button
      id="skipCountdownBtn"
      tabindex="-1">
      Start Now
    </button>

  </div>


  <!-- =========================================================
       PROMPTER
       ========================================================= -->

  <div
    id="prompterViewport"
    tabindex="0">

    <div id="prompterText"></div>

  </div>


  <!-- =========================================================
       YOUR SCRIPT IS EXTERNAL
       ========================================================= -->

  <script
    type="text/javascript"
    src="script.js">
  </script>


  <!-- =========================================================
       TELEPROMPTER CODE
       ========================================================= -->

  <script type="text/javascript">

    /* =========================================================
       SAFETY / POLYFILL
       ========================================================= */

    if (!String.prototype.trim) {

      String.prototype.trim =
        function () {

          return this.replace(
            /^\s+|\s+$/g,
            ''
          );

        };

    }


    /* =========================================================
       DOM REFERENCES
       ========================================================= */

    var header =
      document.getElementById("header");

    var viewport =
      document.getElementById(
        "prompterViewport"
      );

    var prompterText =
      document.getElementById(
        "prompterText"
      );

    var playBtn =
      document.getElementById(
        "playBtn"
      );

    var resetBtn =
      document.getElementById(
        "resetBtn"
      );

    var partSelector =
      document.getElementById(
        "partSelector"
      );

    var eyeLineBtn =
      document.getElementById(
        "eyeLineBtn"
      );

    var chevronLeft =
      document.getElementById(
        "chevronLeft"
      );

    var chevronRight =
      document.getElementById(
        "chevronRight"
      );

    var eyeGuideLine =
      document.getElementById(
        "eyeGuideLine"
      );

    var alignLeftBtn =
      document.getElementById(
        "alignLeftBtn"
      );

    var alignCenterBtn =
      document.getElementById(
        "alignCenterBtn"
      );

    var alignRightBtn =
      document.getElementById(
        "alignRightBtn"
      );

    var speedDownBtn =
      document.getElementById(
        "speedDownBtn"
      );

    var speedUpBtn =
      document.getElementById(
        "speedUpBtn"
      );

    var speedVal =
      document.getElementById(
        "speedVal"
      );

    var fontDownBtn =
      document.getElementById(
        "fontDownBtn"
      );

    var fontUpBtn =
      document.getElementById(
        "fontUpBtn"
      );

    var fontVal =
      document.getElementById(
        "fontVal"
      );

    var widthBtn =
      document.getElementById(
        "widthBtn"
      );

    var mirrorBtn =
      document.getElementById(
        "mirrorBtn"
      );

    var reverseBtn =
      document.getElementById(
        "reverseBtn"
      );

    var fullscreenBtn =
      document.getElementById(
        "fullscreenBtn"
      );

    var timerDisplay =
      document.getElementById(
        "timerDisplay"
      );

    var countdownOverlay =
      document.getElementById(
        "countdownOverlay"
      );

    var countdownNumber =
      document.getElementById(
        "countdownNumber"
      );

    var skipCountdownBtn =
      document.getElementById(
        "skipCountdownBtn"
      );


    /* =========================================================
       SETTINGS
       ========================================================= */

    var eyeLinePositions = [

      {
        ratio: 0.65,
        label: "Eye: Low (65%)"
      },

      {
        ratio: 0.75,
        label: "Eye: Deep (75%)"
      },

      {
        ratio: 0.40,
        label: "Eye: High (40%)"
      },

      {
        ratio: 0.52,
        label: "Eye: Mid (52%)"
      }

    ];


    var currentEyeLineIdx = 0;


    var isPlaying = false;

    var isCountingDown = false;

    var countdownTimer = null;

    var countdownValue = 5;

    var scrollInterval = null;

    var elapsedMs = 0;


    /*
     * SPEED
     *
     * 0.3
     * 0.4
     * 0.5
     * ...
     * 1.0
     * 1.1
     * 1.2
     * 1.3
     * 1.4
     * 1.5
     * ...
     */

    var speed = 1.0;


    /*
     * FONT
     *
     * Default = 44px
     *
     * A- = -4px
     * A+ = +4px
     *
     * Four A- taps:
     *
     * 44
     * 40
     * 36
     * 32
     * 28
     */

    var fontSize = 44;


    var currentY = 0;

    var isMirrored = false;

    var isReversed = false;

    var hideHeaderTimeout = null;


    var widths = [

      {
        size: "400px",
        label: "W: Nar"
      },

      {
        size: "520px",
        label: "W: Mid"
      },

      {
        size: "100%",
        label: "W: Full"
      }

    ];


    var currentWidthIdx = 1;


    /* =========================================================
       FULLSCREEN
       ========================================================= */

    var supportsFullscreen =
      document.documentElement.requestFullscreen ||
      document.documentElement.webkitRequestFullscreen ||
      document.documentElement.mozRequestFullScreen;


    if (!supportsFullscreen) {

      fullscreenBtn.style.display =
        "none";

    }


    /* =========================================================
       BUTTON FOCUS
       ========================================================= */

    var buttons =
      document.getElementsByTagName(
        "button"
      );

    var buttonIndex;


    for (
      buttonIndex = 0;
      buttonIndex < buttons.length;
      buttonIndex++
    ) {

      buttons[buttonIndex].onmouseup =
        function () {
          this.blur();
        };

      buttons[buttonIndex].onclick =
        function () {
          this.blur();
        };

    }


    /* =========================================================
       LOAD SCRIPT PARTS
       ========================================================= */

    var availableParts = [];

    var p;

    for (
      p = 1;
      p <= 6;
      p++
    ) {

      var scriptPart =
        window[
          "SCRIPT_PART_" + p
        ];


      if (
        typeof scriptPart === "string" &&
        scriptPart.replace(
          /^\s+|\s+$/g,
          ""
        ) !== ""
      ) {

        availableParts.push({

          label: "Part " + p,

          content: scriptPart

        });

      }

    }


    /* =========================================================
       CHECK SCRIPT LOAD
       ========================================================= */

    if (
      availableParts.length === 0
    ) {

      prompterText.innerHTML =
        "Script could not be loaded.";

      timerDisplay.innerHTML =
        "ERROR: Check script.js";

    }


    /* =========================================================
       CREATE PART DROPDOWN
       ========================================================= */

    partSelector.innerHTML = "";


    var j;


    for (
      j = 0;
      j < availableParts.length;
      j++
    ) {

      var opt =
        document.createElement(
          "option"
        );

      opt.value = j;

      opt.text =
        availableParts[j].label;

      partSelector.appendChild(
        opt
      );

    }


    if (
      availableParts.length > 1
    ) {

      partSelector.style.display =
        "block";

    } else {

      partSelector.style.display =
        "none";

    }


    /* =========================================================
       RENDER SCRIPT
       ========================================================= */

    function renderScript(content) {

      while (
        prompterText.firstChild
      ) {

        prompterText.removeChild(
          prompterText.firstChild
        );

      }


      var lines =
        content.split("\n");


      var i;


      for (
        i = 0;
        i < lines.length;
        i++
      ) {

        var line =
          lines[i];


        if (line === "") {

          var blank =
            document.createElement(
              "div"
            );

          blank.className =
            "script-blank";

          blank.innerHTML =
            "&nbsp;";

          prompterText.appendChild(
            blank
          );

        } else {

          var lineElement =
            document.createElement(
              "div"
            );

          lineElement.className =
            "script-line";


          lineElement.appendChild(
            document.createTextNode(
              line
            )
          );


          prompterText.appendChild(
            lineElement
          );

        }

      }

    }


    if (
      availableParts.length > 0
    ) {

      renderScript(
        availableParts[0].content
      );

    }


    /* =========================================================
       EYE LINE
       ========================================================= */

    function updateEyeLineVisuals() {

      var pct =
        Math.round(
          eyeLinePositions[
            currentEyeLineIdx
          ].ratio * 100
        );


      chevronLeft.style.top =
        pct + "%";

      chevronRight.style.top =
        pct + "%";

      eyeGuideLine.style.top =
        pct + "%";


      eyeLineBtn.innerHTML =
        eyeLinePositions[
          currentEyeLineIdx
        ].label;

    }


    /* =========================================================
       START POSITION
       ========================================================= */

    function getStartOffset() {

      var viewH =
        window.innerHeight || 768;


      var ratio =
        eyeLinePositions[
          currentEyeLineIdx
        ].ratio;


      return Math.floor(
        viewH * ratio
      );

    }


    function getMinY() {

      var viewH =
        window.innerHeight || 768;


      var textH =
        prompterText.offsetHeight || 0;


      var eyeLine =
        getStartOffset();


      var endLimit =
        eyeLine - textH;


      return Math.min(
        getStartOffset(),
        endLimit
      );

    }


    function clampY(val) {

      var maxY =
        getStartOffset();


      var minY =
        getMinY();


      if (val > maxY) {
        return maxY;
      }


      if (val < minY) {
        return minY;
      }


      return val;

    }


    /* =========================================================
       TRANSFORM
       ========================================================= */

    function applyTransform() {

      var scaleX =
        isMirrored
          ? -1
          : 1;


      var scaleY =
        isReversed
          ? -1
          : 1;


      var transformStr =
        "translate3d(0px, " +
        Math.round(currentY) +
        "px, 0px) scale(" +
        scaleX +
        ", " +
        scaleY +
        ")";


      prompterText.style.webkitTransform =
        transformStr;


      prompterText.style.transform =
        transformStr;

    }


    /* =========================================================
       HEADER
       ========================================================= */

    function showHeader() {

      header.className = "";


      if (hideHeaderTimeout) {

        clearTimeout(
          hideHeaderTimeout
        );

      }


      if (isPlaying) {

        hideHeaderTimeout =
          setTimeout(
            function () {

              header.className =
                "autohidden";

            },
            2500
          );

      }

    }


    window.ontouchstart =
      showHeader;


    /* =========================================================
       TIME
       ========================================================= */

    function formatTimeMs(totalMs) {

      if (totalMs < 0) {
        totalMs = 0;
      }


      var minutes =
        Math.floor(
          totalMs / 60000
        );


      var seconds =
        Math.floor(
          (totalMs % 60000) / 1000
        );


      var tenths =
        Math.floor(
          (totalMs % 1000) / 100
        );


      return (
        minutes < 10
          ? "0" + minutes
          : minutes
      ) +
      ":" +
      (
        seconds < 10
          ? "0" + seconds
          : seconds
      ) +
      "." +
      tenths;

    }


    function updateTimers() {

      var textH =
        prompterText.offsetHeight ||
        1000;


      var pxPerMs =
        (speed * 25) / 1000;


      var totalEstimatedMs =
        textH / pxPerMs;


      timerDisplay.innerHTML =
        formatTimeMs(elapsedMs) +
        " / " +
        formatTimeMs(
          totalEstimatedMs
        );

    }


    /* =========================================================
       RESET
       ========================================================= */

    function resetPrompter() {

      stopCountdown();

      togglePlay(false);


      currentY =
        getStartOffset();


      elapsedMs = 0;


      applyTransform();

      updateTimers();

      showHeader();

    }


    /* =========================================================
       PART SWITCHING
       ========================================================= */

    function switchPart(idx) {

      if (
        availableParts[idx]
      ) {

        partSelector.value =
          idx;


        renderScript(
          availableParts[idx].content
        );


        resetPrompter();

      }

    }


    partSelector.onchange =
      function () {

        switchPart(
          parseInt(
            this.value,
            10
          )
        );


        this.blur();

      };


    /* =========================================================
       SCROLLING
       ========================================================= */

    function stepScroll() {

      if (!isPlaying) {
        return;
      }


      var step =
        (speed * 25) * 0.03;


      elapsedMs += 30;


      if (isReversed) {

        currentY += step;


        if (
          currentY >=
          getStartOffset()
        ) {

          currentY =
            getStartOffset();


          applyTransform();

          togglePlay(false);

          updateTimers();

          return;

        }

      } else {

        currentY -= step;


        var minY =
          getMinY();


        if (
          currentY <= minY
        ) {

          currentY = minY;


          applyTransform();

          togglePlay(false);

          updateTimers();

          return;

        }

      }


      applyTransform();

      updateTimers();

    }


    /* =========================================================
       COUNTDOWN
       ========================================================= */

    function stopCountdown() {

      if (countdownTimer) {

        clearInterval(
          countdownTimer
        );

        countdownTimer = null;

      }


      isCountingDown = false;


      countdownOverlay.style.display =
        "none";

    }


    function startCountdown() {

      stopCountdown();


      isCountingDown = true;


      countdownValue = 5;


      countdownNumber.innerHTML =
        countdownValue;


      countdownOverlay.style.display =
        "block";


      playBtn.innerHTML =
        "Cancel (5s)";


      playBtn.className =
        "btn counting";


      countdownTimer =
        setInterval(
          function () {

            countdownValue--;


            if (
              countdownValue > 0
            ) {

              countdownNumber.innerHTML =
                countdownValue;

            } else {

              stopCountdown();

              startActualScroll();

            }

          },
          1000
        );

    }


    function startActualScroll() {

      isPlaying = true;


      playBtn.innerHTML =
        "Pause";


      playBtn.className =
        "btn paused";


      if (scrollInterval) {

        clearInterval(
          scrollInterval
        );

      }


      scrollInterval =
        setInterval(
          stepScroll,
          30
        );


      showHeader();

    }


    function togglePlay(forceState) {

      if (isCountingDown) {

        stopCountdown();


        playBtn.innerHTML =
          "Play";


        playBtn.className =
          "btn";


        showHeader();


        return;

      }


      var target;


      if (
        typeof forceState !==
        "undefined"
      ) {

        target =
          forceState;

      } else {

        target =
          !isPlaying;

      }


      if (target) {

        startCountdown();

      } else {

        isPlaying = false;


        playBtn.innerHTML =
          "Play";


        playBtn.className =
          "btn";


        if (scrollInterval) {

          clearInterval(
            scrollInterval
          );

          scrollInterval = null;

        }


        showHeader();

      }

    }


    skipCountdownBtn.onclick =
      function () {

        stopCountdown();

        startActualScroll();

        this.blur();

      };


    /* =========================================================
       WIDTH
       ========================================================= */

    function cycleWidth() {

      currentWidthIdx =
        (
          currentWidthIdx + 1
        ) %
        widths.length;


      prompterText.style.maxWidth =
        widths[
          currentWidthIdx
        ].size;


      widthBtn.innerHTML =
        widths[
          currentWidthIdx
        ].label;


      currentY =
        clampY(currentY);


      applyTransform();

      updateTimers();

    }


    widthBtn.onclick =
      function () {

        cycleWidth();

        saveSettings();

        this.blur();

      };


    /* =========================================================
       EYE LINE
       ========================================================= */

    function cycleEyeLine() {

      var oldRatio =
        eyeLinePositions[
          currentEyeLineIdx
        ].ratio;


      currentEyeLineIdx =
        (
          currentEyeLineIdx + 1
        ) %
        eyeLinePositions.length;


      var newRatio =
        eyeLinePositions[
          currentEyeLineIdx
        ].ratio;


      updateEyeLineVisuals();


      var viewH =
        window.innerHeight || 768;


      var shiftPx =
        Math.floor(
          viewH *
          (newRatio - oldRatio)
        );


      currentY =
        clampY(
          currentY + shiftPx
        );


      applyTransform();

      updateTimers();

    }


    eyeLineBtn.onclick =
      function () {

        cycleEyeLine();

        saveSettings();

        this.blur();

      };


    /* =========================================================
       TOUCH DRAGGING
       ========================================================= */

    var touchStartY = 0;

    var touchStartCurrentY = 0;

    var isDragging = false;


    viewport.ontouchstart =
      function (e) {

        showHeader();


        if (
          e.touches &&
          e.touches.length === 1
        ) {

          touchStartY =
            e.touches[0].pageY;


          touchStartCurrentY =
            currentY;


          isDragging = true;

        }

      };


    viewport.ontouchmove =
      function (e) {

        if (
          isDragging &&
          e.touches &&
          e.touches.length === 1
        ) {

          if (e.preventDefault) {
            e.preventDefault();
          }


          var touchCurrentY =
            e.touches[0].pageY;


          var deltaY =
            touchCurrentY -
            touchStartY;


          currentY =
            clampY(
              touchStartCurrentY +
              deltaY
            );


          applyTransform();

        }

      };


    viewport.ontouchend =
      function () {

        isDragging = false;

      };


    viewport.ontouchcancel =
      function () {

        isDragging = false;

      };


    /* =========================================================
       MOUSE DRAGGING
       ========================================================= */

    viewport.onmousedown =
      function (e) {

        showHeader();


        e =
          e ||
          window.event;


        touchStartY =
          e.pageY ||
          e.clientY;


        touchStartCurrentY =
          currentY;


        isDragging = true;

      };


    window.onmousemove =
      function (e) {

        if (isDragging) {

          e =
            e ||
            window.event;


          var mouseY =
            e.pageY ||
            e.clientY;


          var deltaY =
            mouseY -
            touchStartY;


          currentY =
            clampY(
              touchStartCurrentY +
              deltaY
            );


          applyTransform();

        }

      };


    window.onmouseup =
      function () {

        isDragging = false;

      };


    /* =========================================================
       MOUSE WHEEL
       ========================================================= */

    function handleWheel(e) {

      e =
        e ||
        window.event;


      if (e.preventDefault) {
        e.preventDefault();
      }


      showHeader();


      var delta =
        e.deltaY ||
        -e.wheelDelta ||
        0;


      currentY =
        clampY(
          currentY -
          delta * 0.8
        );


      applyTransform();

    }


    if (
      viewport.addEventListener
    ) {

      viewport.addEventListener(
        "wheel",
        handleWheel,
        false
      );


      viewport.addEventListener(
        "mousewheel",
        handleWheel,
        false
      );


      viewport.addEventListener(
        "DOMMouseScroll",
        handleWheel,
        false
      );

    } else {

      viewport.onmousewheel =
        handleWheel;

    }


    /* =========================================================
       ALIGNMENT
       ========================================================= */

    function setAlignment(
      alignment
    ) {

      prompterText.style.textAlign =
        alignment;


      alignLeftBtn.className =
        alignment === "left"
          ? "btn active"
          : "btn";


      alignCenterBtn.className =
        alignment === "center"
          ? "btn active"
          : "btn";


      alignRightBtn.className =
        alignment === "right"
          ? "btn active"
          : "btn";


      saveSettings();

    }


    /* =========================================================
       PLAY / RESET
       ========================================================= */

    playBtn.onclick =
      function () {

        togglePlay();

        this.blur();

      };


    resetBtn.onclick =
      function () {

        resetPrompter();

        this.blur();

      };


    alignLeftBtn.onclick =
      function () {

        setAlignment("left");

        this.blur();

      };


    alignCenterBtn.onclick =
      function () {

        setAlignment("center");

        this.blur();

      };


    alignRightBtn.onclick =
      function () {

        setAlignment("right");

        this.blur();

      };


    /* =========================================================
       SPEED
       ========================================================= */

    speedDownBtn.onclick =
      function () {

        if (
          speed > 0.3
        ) {

          speed =
            +(speed - 0.1)
              .toFixed(1);

        }


        updateSpeedDisplay();

        updateTimers();

        saveSettings();

        this.blur();

      };


    speedUpBtn.onclick =
      function () {

        if (
          speed < 8.0
        ) {

          speed =
            +(speed + 0.1)
              .toFixed(1);

        }


        updateSpeedDisplay();

        updateTimers();

        saveSettings();

        this.blur();

      };


    function updateSpeedDisplay() {

      /*
       * Display:
       *
       * 1x
       * 1.1x
       * 1.2x
       * 1.3x
       * ...
       */

      if (speed === 1) {

        speedVal.innerHTML =
          "1x";

      } else {

        speedVal.innerHTML =
          speed.toFixed(1) + "x";

      }

    }


    /* =========================================================
       FONT SIZE
       ========================================================= */

    fontDownBtn.onclick =
      function () {

        /*
         * Every A- = -4px
         */

        if (
          fontSize > 16
        ) {

          fontSize -= 4;

        }


        updateFontDisplay();


        prompterText.style.fontSize =
          fontSize + "px";


        currentY =
          clampY(currentY);


        applyTransform();

        updateTimers();

        saveSettings();

        this.blur();

      };


    fontUpBtn.onclick =
      function () {

        /*
         * Every A+ = +4px
         */

        if (
          fontSize < 100
        ) {

          fontSize += 4;

        }


        updateFontDisplay();


        prompterText.style.fontSize =
          fontSize + "px";


        currentY =
          clampY(currentY);


        applyTransform();

        updateTimers();

        saveSettings();

        this.blur();

      };


    function updateFontDisplay() {

      fontVal.innerHTML =
        fontSize + "px";

    }


    /* =========================================================
       MIRROR
       ========================================================= */

    mirrorBtn.onclick =
      function () {

        isMirrored =
          !isMirrored;


        mirrorBtn.className =
          isMirrored
            ? "btn active"
            : "btn";


        applyTransform();

        saveSettings();

        this.blur();

      };


    /* =========================================================
       REVERSE
       ========================================================= */

    reverseBtn.onclick =
      function () {

        isReversed =
          !isReversed;


        reverseBtn.className =
          isReversed
            ? "btn active"
            : "btn";


        applyTransform();

        saveSettings();

        this.blur();

      };


    /* =========================================================
       FULLSCREEN
       ========================================================= */

    fullscreenBtn.onclick =
      function () {

        var doc =
          document.documentElement;


        var isFull =
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement;


        if (!isFull) {

          if (
            doc.requestFullscreen
          ) {

            doc.requestFullscreen();

          } else if (
            doc.webkitRequestFullscreen
          ) {

            doc.webkitRequestFullscreen();

          } else if (
            doc.mozRequestFullScreen
          ) {

            doc.mozRequestFullScreen();

          }

        } else {

          if (
            document.exitFullscreen
          ) {

            document.exitFullscreen();

          } else if (
            document.webkitExitFullscreen
          ) {

            document.webkitExitFullscreen();

          } else if (
            document.mozCancelFullScreen
          ) {

            document.mozCancelFullScreen();

          }

        }


        this.blur();

      };


    /* =========================================================
       KEYBOARD
       ========================================================= */

    function handleKeyDown(e) {

      e =
        e ||
        window.event;


      var code =
        e.keyCode ||
        e.which;


      showHeader();


      /*
       * NUMBER KEYS 1-6
       */

      if (
        code >= 49 &&
        code <= 54
      ) {

        var partNum =
          code - 48;


        var partIdx =
          partNum - 1;


        if (
          availableParts[partIdx]
        ) {

          switchPart(
            partIdx
          );


          return false;

        }

      }


      /*
       * SPACEBAR
       */

      if (
        code === 32
      ) {

        if (e.preventDefault) {
          e.preventDefault();
        }


        if (e.stopPropagation) {
          e.stopPropagation();
        }


        togglePlay();


        return false;

      }


      /*
       * UP ARROW
       */

      if (
        code === 38
      ) {

        if (e.preventDefault) {
          e.preventDefault();
        }


        currentY =
          clampY(
            currentY + 80
          );


        applyTransform();


        return false;

      }


      /*
       * DOWN ARROW
       */

      if (
        code === 40
      ) {

        if (e.preventDefault) {
          e.preventDefault();
        }


        currentY =
          clampY(
            currentY - 80
          );


        applyTransform();


        return false;

      }


      /*
       * E = EYE LINE
       */

      if (
        code === 69
      ) {

        cycleEyeLine();

        saveSettings();


        return false;

      }


      /*
       * R = RESET
       */

      if (
        code === 82
      ) {

        resetPrompter();


        return false;

      }

    }


    if (
      window.addEventListener
    ) {

      window.addEventListener(
        "keydown",
        handleKeyDown,
        true
      );

    } else {

      window.onkeydown =
        handleKeyDown;

    }


    /* =========================================================
       SAVE SETTINGS
       ========================================================= */

    function saveSettings() {

      try {

        if (
          !window.localStorage
        ) {

          return;

        }


        localStorage.setItem(
          "uvistix_speed",
          String(speed)
        );


        localStorage.setItem(
          "uvistix_font",
          String(fontSize)
        );


        localStorage.setItem(
          "uvistix_width",
          String(currentWidthIdx)
        );


        localStorage.setItem(
          "uvistix_eye",
          String(currentEyeLineIdx)
        );


        localStorage.setItem(
          "uvistix_mirror",
          isMirrored
            ? "1"
            : "0"
        );


        localStorage.setItem(
          "uvistix_reverse",
          isReversed
            ? "1"
            : "0"
        );


        localStorage.setItem(
          "uvistix_alignment",
          prompterText.style.textAlign ||
          "center"
        );

      } catch (e) {

        /*
         * Ignore storage errors.
         */

      }

    }


    /* =========================================================
       LOAD SETTINGS
       ========================================================= */

    function loadSettings() {

      try {

        if (
          !window.localStorage
        ) {

          return;

        }


        var storedSpeed =
          parseFloat(
            localStorage.getItem(
              "uvistix_speed"
            )
          );


        if (
          !isNaN(storedSpeed) &&
          storedSpeed >= 0.3 &&
          storedSpeed <= 8.0
        ) {

          speed =
            +storedSpeed.toFixed(1);

        }


        var storedFont =
          parseInt(
            localStorage.getItem(
              "uvistix_font"
            ),
            10
          );


        if (
          !isNaN(storedFont) &&
          storedFont >= 16 &&
          storedFont <= 100
        ) {

          fontSize =
            storedFont;

        }


        var storedWidth =
          parseInt(
            localStorage.getItem(
              "uvistix_width"
            ),
            10
          );


        if (
          !isNaN(storedWidth) &&
          storedWidth >= 0 &&
          storedWidth < widths.length
        ) {

          currentWidthIdx =
            storedWidth;

        }


        var storedEye =
          parseInt(
            localStorage.getItem(
              "uvistix_eye"
            ),
            10
          );


        if (
          !isNaN(storedEye) &&
          storedEye >= 0 &&
          storedEye <
            eyeLinePositions.length
        ) {

          currentEyeLineIdx =
            storedEye;

        }


        var storedMirror =
          localStorage.getItem(
            "uvistix_mirror"
          );


        if (
          storedMirror === "1"
        ) {

          isMirrored = true;

        }


        var storedReverse =
          localStorage.getItem(
            "uvistix_reverse"
          );


        if (
          storedReverse === "1"
        ) {

          isReversed = true;

        }


        var storedAlignment =
          localStorage.getItem(
            "uvistix_alignment"
          );


        if (
          storedAlignment === "left" ||
          storedAlignment === "center" ||
          storedAlignment === "right"
        ) {

          prompterText.style.textAlign =
            storedAlignment;

        }

      } catch (e) {

        /*
         * Ignore storage errors.
         */

      }

    }


    /* =========================================================
       APPLY SETTINGS
       ========================================================= */

    loadSettings();


    prompterText.style.fontSize =
      fontSize + "px";


    prompterText.style.maxWidth =
      widths[
        currentWidthIdx
      ].size;


    widthBtn.innerHTML =
      widths[
        currentWidthIdx
      ].label;


    mirrorBtn.className =
      isMirrored
        ? "btn active"
        : "btn";


    reverseBtn.className =
      isReversed
        ? "btn active"
        : "btn";


    if (
      prompterText.style.textAlign ===
      "left"
    ) {

      alignLeftBtn.className =
        "btn active";

      alignCenterBtn.className =
        "btn";

      alignRightBtn.className =
        "btn";

    } else if (
      prompterText.style.textAlign ===
      "right"
    ) {

      alignLeftBtn.className =
        "btn";

      alignCenterBtn.className =
        "btn";

      alignRightBtn.className =
        "btn active";

    } else {

      prompterText.style.textAlign =
        "center";


      alignLeftBtn.className =
        "btn";


      alignCenterBtn.className =
        "btn active";


      alignRightBtn.className =
        "btn";

    }


    updateSpeedDisplay();

    updateFontDisplay();

    updateEyeLineVisuals();


    /* =========================================================
       INITIAL POSITION
       ========================================================= */

    currentY =
      getStartOffset();


    applyTransform();

    updateTimers();


    /* =========================================================
       WINDOW LOAD
       ========================================================= */

    window.onload =
      function () {

        document.body.focus();


        currentY =
          getStartOffset();


        applyTransform();


        updateTimers();

      };

  </script>

</body>
</html>
