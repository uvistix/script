<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Teleprompter</title>
  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff !important;
      overflow: hidden;
      font-family: Helvetica, Arial, sans-serif;
    }

    /* Top Control Bar */
    #header {
      background: #141414;
      padding: 6px 8px;
      border-bottom: 1px solid #333333;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      z-index: 100;
      overflow: hidden;
    }

    .btn {
      background: #2b2b2b;
      color: #ffffff !important;
      border: 1px solid #444444;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      float: left;
      margin-right: 5px;
      height: 34px;
      line-height: 24px;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .btn.active {
      background: #0070f3 !important;
    }

    #playBtn {
      background: #16a34a;
    }

    #playBtn.paused {
      background: #ea580c;
    }

    .control-label {
      float: left;
      font-size: 12px;
      color: #ffffff !important;
      line-height: 34px;
      margin-right: 5px;
    }

    .timer-box {
      float: right;
      font-family: monospace;
      font-size: 11px;
      background: #000000;
      padding: 4px 6px;
      border: 1px solid #333333;
      border-radius: 4px;
      color: #ffffff !important;
      line-height: 24px;
      height: 34px;
    }

    /* Prompter Viewport Container */
    #prompterViewport {
      position: absolute;
      top: 48px;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      overflow-y: scroll;
      background: #000000;
      /* Explicit pixel padding handled dynamically by JS to fix 35vh bug */
      padding-left: 12px;
      padding-right: 12px;
    }

    #prompterText {
      width: 100%;
      font-size: 44px;
      line-height: 1.4;
      font-weight: bold;
      text-align: center;
      color: #ffffff !important;
      white-space: pre-wrap;
      word-wrap: break-word;
      outline: none;
    }

    /* Reading Guide Line */
    #guideMarker {
      position: absolute;
      top: 40%;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.3);
      z-index: 50;
      pointer-events: none;
    }

    /* Hardware Flip Transforms */
    .mirror {
      -webkit-transform: scaleX(-1);
      transform: scaleX(-1);
    }
    .reverse {
      -webkit-transform: scaleY(-1);
      transform: scaleY(-1);
    }
    .mirror.reverse {
      -webkit-transform: scale(-1, -1);
      transform: scale(-1, -1);
    }
  </style>
</head>
<body>

  <!-- Controls Header -->
  <div id="header">
    <button id="playBtn" class="btn">Play</button>
    <button id="resetBtn" class="btn">Reset</button>

    <!-- Alignment -->
    <button id="alignLeftBtn" class="btn">Left</button>
    <button id="alignCenterBtn" class="btn active">Center</button>
    <button id="alignRightBtn" class="btn">Right</button>

    <!-- Speed -->
    <span class="control-label">Spd:</span>
    <button id="speedDownBtn" class="btn">-</button>
    <button id="speedUpBtn" class="btn">+</button>
    <span id="speedVal" class="control-label" style="font-weight:bold;">1.5x</span>

    <!-- Font Size -->
    <span class="control-label">Font:</span>
    <button id="fontDownBtn" class="btn">A-</button>
    <button id="fontUpBtn" class="btn">A+</button>

    <!-- Mirror / Reverse / Fullscreen -->
    <button id="mirrorBtn" class="btn">Mirror</button>
    <button id="reverseBtn" class="btn">Reverse</button>
    <button id="fullscreenBtn" class="btn">Full</button>

    <div id="timerDisplay" class="timer-box">00:00.0 / 00:00.0</div>
  </div>

  <div id="guideMarker"></div>

  <!-- Viewport Area -->
  <div id="prompterViewport">
    <div id="prompterText" contenteditable="true">Loading script.txt...</div>
  </div>

  <script>
    var viewport = document.getElementById("prompterViewport");
    var prompterText = document.getElementById("prompterText");
    var playBtn = document.getElementById("playBtn");
    var resetBtn = document.getElementById("resetBtn");
    var alignLeftBtn = document.getElementById("alignLeftBtn");
    var alignCenterBtn = document.getElementById("alignCenterBtn");
    var alignRightBtn = document.getElementById("alignRightBtn");
    var speedDownBtn = document.getElementById("speedDownBtn");
    var speedUpBtn = document.getElementById("speedUpBtn");
    var speedVal = document.getElementById("speedVal");
    var fontDownBtn = document.getElementById("fontDownBtn");
    var fontUpBtn = document.getElementById("fontUpBtn");
    var mirrorBtn = document.getElementById("mirrorBtn");
    var reverseBtn = document.getElementById("reverseBtn");
    var fullscreenBtn = document.getElementById("fullscreenBtn");
    var timerDisplay = document.getElementById("timerDisplay");

    var isPlaying = false;
    var scrollInterval = null;
    var elapsedMs = 0;
    var speed = 1.5;
    var fontSize = 44;
    var isMirrored = false;
    var isReversed = false;

    // Cross-browser helper for reading/setting text content in iOS 5
    function setText(elem, text) {
      if ("textContent" in elem) {
        elem.textContent = text;
      } else {
        elem.innerText = text;
      }
    }

    function getText(elem) {
      return elem.textContent || elem.innerText || "";
    }

    // Fix iOS 5 viewport height calculation (replacing CSS 35vh)
    function fixViewportPadding() {
      var viewH = window.innerHeight || document.documentElement.clientHeight || 768;
      var pad = Math.floor(viewH * 0.35);
      viewport.style.paddingTop = pad + "px";
      viewport.style.paddingBottom = pad + "px";
    }

    fixViewportPadding();
    window.onresize = function() {
      fixViewportPadding();
      updateTimers();
    };

    // Robust Ajax fetch with cache-busting
    function loadScriptFile() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "script.txt?t=" + new Date().getTime(), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200 || xhr.status === 0) {
            setText(prompterText, xhr.responseText);
          } else {
            setText(prompterText, "Error loading script.txt. Check your GitHub repository.");
          }
          updateTimers();
        }
      };
      xhr.send(null);
    }

    loadScriptFile();

    function formatTimeMs(totalMs) {
      var minutes = Math.floor(totalMs / 60000);
      var seconds = Math.floor((totalMs % 60000) / 1000);
      var tenths = Math.floor((totalMs % 1000) / 100);
      return (minutes < 10 ? "0" + minutes : minutes) + ":" +
             (seconds < 10 ? "0" + seconds : seconds) + "." + tenths;
    }

    function updateTimers() {
      var scrollableDistance = prompterText.offsetHeight - (viewport.clientHeight || 500);
      var pxPerMs = (speed * 25) / 1000;
      var totalEstimatedMs = scrollableDistance > 0 ? (scrollableDistance / pxPerMs) : 0;
      timerDisplay.innerHTML = formatTimeMs(elapsedMs) + " / " + formatTimeMs(totalEstimatedMs);
    }

    // iOS 5 smooth scroll tick
    function stepScroll() {
      if (!isPlaying) return;
      var step = (speed * 25) * 0.025; // 40fps step
      elapsedMs += 25;

      if (isReversed) {
        viewport.scrollTop -= step;
        if (viewport.scrollTop <= 0) {
          togglePlay(false);
        }
      } else {
        viewport.scrollTop += step;
        if (viewport.scrollTop + viewport.clientHeight >= viewport.scrollHeight - 4) {
          togglePlay(false);
        }
      }
      updateTimers();
    }

    function togglePlay(forceState) {
      isPlaying = forceState !== undefined ? forceState : !isPlaying;

      if (isPlaying) {
        playBtn.innerHTML = "Pause";
        playBtn.className = "btn paused";
        prompterText.setAttribute("contenteditable", "false");
        if (scrollInterval) clearInterval(scrollInterval);
        scrollInterval = setInterval(stepScroll, 25);
      } else {
        playBtn.innerHTML = "Play";
        playBtn.className = "btn";
        prompterText.setAttribute("contenteditable", "true");
        if (scrollInterval) clearInterval(scrollInterval);
      }
    }

    function resetPrompter() {
      togglePlay(false);
      viewport.scrollTop = 0;
      elapsedMs = 0;
      updateTimers();
    }

    function setAlignment(alignment) {
      prompterText.style.textAlign = alignment;
      alignLeftBtn.className = alignment === "left" ? "btn active" : "btn";
      alignCenterBtn.className = alignment === "center" ? "btn active" : "btn";
      alignRightBtn.className = alignment === "right" ? "btn active" : "btn";
    }

    // Touch & Click bindings for iPad responsiveness
    function bindAction(elem, callback) {
      elem.onclick = function(e) {
        if (e && e.preventDefault) e.preventDefault();
        callback();
      };
    }

    bindAction(playBtn, function() { togglePlay(); });
    bindAction(resetBtn, resetPrompter);

    bindAction(alignLeftBtn, function() { setAlignment("left"); });
    bindAction(alignCenterBtn, function() { setAlignment("center"); });
    bindAction(alignRightBtn, function() { setAlignment("right"); });

    bindAction(speedDownBtn, function() {
      if (speed > 0.3) speed = +(speed - 0.2).toFixed(1);
      speedVal.innerHTML = speed + "x";
      updateTimers();
    });

    bindAction(speedUpBtn, function() {
      if (speed < 8.0) speed = +(speed + 0.2).toFixed(1);
      speedVal.innerHTML = speed + "x";
      updateTimers();
    });

    bindAction(fontDownBtn, function() {
      if (fontSize > 18) fontSize -= 4;
      prompterText.style.fontSize = fontSize + "px";
      updateTimers();
    });

    bindAction(fontUpBtn, function() {
      if (fontSize < 100) fontSize += 4;
      prompterText.style.fontSize = fontSize + "px";
      updateTimers();
    });

    bindAction(mirrorBtn, function() {
      isMirrored = !isMirrored;
      mirrorBtn.className = isMirrored ? "btn active" : "btn";
      applyTransform();
    });

    bindAction(reverseBtn, function() {
      isReversed = !isReversed;
      reverseBtn.className = isReversed ? "btn active" : "btn";
      applyTransform();
    });

    function applyTransform() {
      prompterText.className = "";
      if (isMirrored && isReversed) {
        prompterText.className = "mirror reverse";
      } else if (isMirrored) {
        prompterText.className = "mirror";
      } else if (isReversed) {
        prompterText.className = "reverse";
      }
    }

    bindAction(fullscreenBtn, function() {
      var doc = document.documentElement;
      var isFull = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;

      if (!isFull) {
        if (doc.requestFullscreen) {
          doc.requestFullscreen();
        } else if (doc.webkitRequestFullscreen) {
          doc.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    });

    // Keyboard controls for Laptop
    window.onkeydown = function(e) {
      e = e || window.event;
      if (document.activeElement === prompterText) return;

      if (e.keyCode === 32) {
        if (e.preventDefault) e.preventDefault();
        togglePlay();
      } else if (e.keyCode === 38) {
        speedUpBtn.onclick();
      } else if (e.keyCode === 40) {
        speedDownBtn.onclick();
      }
    };

    updateTimers();
  </script>
</body>
</html>
